<title>Champions Admin</title>
<!--WEB_HEAD-->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onload="window.__fsChart&&window.__fsChart()"></script>
<style>
/* Layout: an operations console. Sidebar on the right (RTL), a filter bar on
   top of every analytic view, KPI strip first, charts, then the tables that
   back them. Same palette and type as the rider app; money in gold. */
:root {
  --bg: #070A08; --bg-2: #0B120D; --surface: #0F1912; --surface-2: #13201A;
  --line: #1D2C21; --line-2: #2A3E2F;
  --ink: #DCF0E0; --muted: #94AC99; --dim: #5F7265;
  --green: #34B24C; --green-hi: #5BD06F; --on-green: #04140A; --green-soft: rgba(52,178,76,.13);
  --gold: #E2A838; --gold-soft: rgba(226,168,56,.13); --on-gold: #1A1204;
  --danger: #FF7A6E; --danger-soft: rgba(255,122,110,.12);
  --info: #7DB8FF; --info-soft: rgba(125,184,255,.12);
  --s1: #3987e5; --s2: #199e70; --s3: #d95926;   /* validated chart series (dark) */
  --shadow: 0 18px 40px -22px rgba(0,0,0,.85);
  --f-display: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F4F6F3; --bg-2: #EBF1EA; --surface: #FFFFFF; --surface-2: #F2F8F3; --line: #DCE5DB; --line-2: #C4D2C4;
  --ink: #0C150E; --muted: #46594B; --dim: #7A9180; --green: #187A31; --green-hi: #136B2A; --on-green: #FFFFFF; --green-soft: rgba(24,122,49,.09);
  --gold: #946609; --gold-soft: rgba(148,102,9,.1); --on-gold: #FFFFFF; --danger: #C2362B; --danger-soft: rgba(194,54,43,.08);
  --info: #1F5FAD; --info-soft: rgba(31,95,173,.08); --s1: #2a78d6; --s2: #1baf7a; --s3: #eb6834;
  --shadow: 0 14px 32px -20px rgba(12,40,20,.28); color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #F4F6F3; --bg-2: #EBF1EA; --surface: #FFFFFF; --surface-2: #F2F8F3; --line: #DCE5DB; --line-2: #C4D2C4;
  --ink: #0C150E; --muted: #46594B; --dim: #7A9180; --green: #187A31; --green-hi: #136B2A; --on-green: #FFFFFF; --green-soft: rgba(24,122,49,.09);
  --gold: #946609; --gold-soft: rgba(148,102,9,.1); --on-gold: #FFFFFF; --danger: #C2362B; --danger-soft: rgba(194,54,43,.08);
  --info: #1F5FAD; --info-soft: rgba(31,95,173,.08); --s1: #2a78d6; --s2: #1baf7a; --s3: #eb6834;
  --shadow: 0 14px 32px -20px rgba(12,40,20,.28); color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { direction: rtl; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 2px; }
.num { font-family: var(--f-num); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.mk { width: 34px; height: 34px; flex: none; background: url("data:image/webp;base64,__LOGO__") center/contain no-repeat; }

/* ── Shell ── */
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg-2); border-inline-end: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
.side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.side .wm { font: 800 19px/1 var(--f-num); letter-spacing: .03em; text-transform: uppercase; }
.side .wm b { color: var(--green); }
.side .wm small { display: block; font: 600 10px var(--f-body); letter-spacing: .16em; color: var(--muted); margin-top: 3px; }
.nav-group { font: 600 11px var(--f-body); color: var(--dim); letter-spacing: .08em; padding: 12px 10px 4px; }
.nav { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: start; padding: 9px 10px; border-radius: 10px; color: var(--muted); font: 600 14px var(--f-body); width: 100%; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav:hover { background: var(--surface); color: var(--ink); }
.nav[aria-current="page"] { background: var(--green-soft); color: var(--green-hi); }
.nav .count { margin-inline-start: auto; min-width: 22px; height: 20px; border-radius: 10px; background: var(--gold); color: var(--on-gold); font: 800 12px/20px var(--f-num); text-align: center; padding: 0 6px; }
.side .me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 8px 0; font-size: 13px; }
.side .me b { display: block; font: 700 14px var(--f-display); }
.main { min-width: 0; padding: 20px 24px 60px; display: grid; gap: 16px; align-content: start; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font: 800 22px var(--f-display); }
.page-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.mobile-top { display: none; }
.mobile-top .brand { display: flex; align-items: center; gap: 8px; }
.mobile-top .wm { font: 800 18px/1 var(--f-num); text-transform: uppercase; letter-spacing: .03em; }
.mobile-top .wm b { color: var(--green); }

/* ── Controls ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; border-radius: 10px; padding: 7px 14px; border: 1px solid transparent; font: 700 13px var(--f-display); text-decoration: none; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--green); color: var(--on-green); }
.btn-gold { background: var(--gold); color: var(--on-gold); }
.btn-ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn-danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 40%, transparent); color: var(--danger); }
.btn-wa { background: #25D366; color: #052E16; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.filters label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.filters select, .filters input, .field input, .field select, .field textarea {
  min-height: 36px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg-2); padding: 6px 10px; font-size: 14px; }
.filters input[type=search] { min-width: 220px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 5px 11px; font: 600 13px var(--f-body); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field { display: grid; gap: 4px; }
.field label { font: 600 12px var(--f-body); color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.field .err { font-size: 12px; color: var(--danger); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }

/* ── Cards & KPIs ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 4px; font: 700 15px var(--f-display); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font: 500 12px var(--f-body); color: var(--muted); }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis, .kpis.k3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.kpi .lbl { font-size: 12px; color: var(--muted); }
.kpi .num { font-size: 32px; }
.kpi .num.gold { color: var(--gold); }
.kpi .num.txt { font: 700 17px/1.35 var(--f-display); }
.kpi .delta { font-size: 12px; color: var(--muted); }
.kpi .delta b.up { color: var(--green-hi); } .kpi .delta b.down { color: var(--danger); }
.charts { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.charts > .card { grid-column: span 6; }
.charts > .card.wide { grid-column: span 12; }
.charts > .card.third { grid-column: span 4; }
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 320px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }

/* Funnel */
.funnel { display: grid; gap: 6px; }
.funnel-row { display: grid; grid-template-columns: 120px 1fr 92px; align-items: center; gap: 10px; font-size: 13px; }
.funnel-row .bar { height: 26px; border-radius: 4px; background: var(--s2); min-width: 2px; max-width: 100%; justify-self: start; }
.funnel-row .n { text-align: end; font-variant-numeric: tabular-nums; }
.funnel-row .n b { font: 800 17px var(--f-num); }
.funnel-row .n small { color: var(--muted); margin-inline-start: 4px; }

/* ── Tables ── */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: start; font: 600 12px var(--f-body); color: var(--muted); background: var(--surface-2); padding: 9px 10px; position: sticky; top: 0; white-space: nowrap; cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ▲"; } th[aria-sort="descending"]::after { content: " ▼"; }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--surface-2); }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .gold { color: var(--gold); font-weight: 700; }
.pager { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px 0; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font: 600 12px/1.5 var(--f-body); white-space: nowrap; border: 1px solid transparent; }
.pill.green { background: var(--green-soft); color: var(--green-hi); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.red { background: var(--danger-soft); color: var(--danger); }
.pill.blue { background: var(--info-soft); color: var(--info); }
.pill.dim { background: var(--surface-2); color: var(--muted); border-color: var(--line-2); }
.flag { color: var(--danger); font-size: 12px; font-weight: 600; }
.bulk { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius: 12px; padding: 8px 12px; }

/* ── Drawer & modal ── */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55); display: flex; justify-content: flex-start; }
.drawer { width: min(460px, 100%); height: 100%; overflow-y: auto; background: var(--bg); border-inline-end: 1px solid var(--line-2); padding: 18px; display: grid; gap: 14px; align-content: start; }
.overlay.center { justify-content: center; align-items: center; padding: 16px; }
.overlay.center .drawer { height: auto; max-height: 92vh; border: 1px solid var(--line-2); border-radius: 18px; }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.drawer-head h3 { margin: 0; font: 800 18px var(--f-display); }
.x { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; padding: 0; }
.x svg { width: 16px; height: 16px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { font-weight: 600; text-align: end; overflow-wrap: anywhere; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.steps div { font-size: 11px; text-align: center; color: var(--dim); display: grid; gap: 4px; }
.steps div::before { content: ""; height: 5px; border-radius: 3px; background: var(--line-2); }
.steps .done::before { background: var(--green); } .steps .done { color: var(--green-hi); }
.secret { font: 800 26px var(--f-num); letter-spacing: .08em; text-align: center; background: var(--gold-soft); color: var(--gold); border-radius: 12px; padding: 10px; user-select: all; direction: ltr; }
.toast { position: fixed; z-index: 60; bottom: 20px; left: 50%; transform: translate(-50%, 150%); opacity: 0; visibility: hidden; transition: transform .35s, opacity .35s, visibility .35s; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; } .toast.bad { background: var(--danger); color: #fff; }
.empty { text-align: center; color: var(--muted); padding: 28px; border: 1px dashed var(--line-2); border-radius: 14px; }
.demo-flag { font-size: 12px; color: var(--gold); border: 1px dashed color-mix(in srgb, var(--gold) 50%, transparent); border-radius: 10px; padding: 6px 10px; text-align: center; }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .card { width: min(380px, 100%); display: grid; gap: 14px; padding: 24px; }
.login .brand { display: flex; align-items: center; gap: 10px; justify-content: center; }
.login .brand .wm { font: 800 24px/1 var(--f-num); text-transform: uppercase; }
.login .brand .wm b { color: var(--green); }
.boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); }
.boot-in { display: grid; justify-items: center; gap: 14px; animation: bootIn .4s ease both; }
.boot .mk { width: 64px; height: 64px; }
.boot .wm { font: 900 30px var(--f-display); letter-spacing: .02em; color: var(--ink); text-transform: uppercase; }
.boot .wm b { color: var(--green); }
.boot-bar { width: 180px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative; }
.boot-bar i { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 4px; background: var(--green); animation: bootBar 1.1s ease-in-out infinite; }
.boot-t { color: var(--muted); font-size: 13px; }
@keyframes bootBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
@keyframes bootIn { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .boot-bar i, .boot-in { animation: none; } }
.ladder { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; margin-top: 10px; }
.rung { display: grid; gap: 2px; text-align: center; padding: 8px 2px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); font-size: 11px; color: var(--dim); }
.rung b { font: 800 14px var(--f-display); color: var(--muted); }
.rung.on { background: var(--gold-soft); border-color: color-mix(in srgb, var(--gold) 45%, transparent); color: var(--gold); }
.rung.on b { color: var(--gold); }
.ladder-bar { height: 6px; border-radius: 6px; background: var(--line); margin-top: 8px; overflow: hidden; }
.ladder-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--gold)); border-radius: 6px; }
.timeline { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; gap: 2px; padding: 0 18px 14px 0; position: relative; border-inline-start: 2px solid var(--line); margin-inline-start: 6px; padding-inline-start: 16px; }
.timeline li::before { content: ''; position: absolute; inset-inline-start: -7px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); border: 2px solid var(--surface); }
.timeline li:last-child { border-color: transparent; }
.timeline li span { font-size: 12px; }
@media (max-width: 700px) { .ladder { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.chart-box.donut { height: 200px; }
.chart-box.gauge { height: 170px; }
.donut-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-c b { font: 800 28px var(--f-display); line-height: 1; }
.donut-c span { font-size: 11px; color: var(--muted); margin-top: 4px; }
.gauge .donut-c { padding-top: 54px; }
.dl { display: grid; gap: 6px; margin-top: 10px; font-size: 12px; }
.dl div { display: grid; grid-template-columns: 10px 1fr auto 38px; gap: 8px; align-items: center; }
.dl i { width: 10px; height: 10px; border-radius: 3px; }
.dl b { font-variant-numeric: tabular-nums; }
.dl small { color: var(--muted); text-align: end; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--ink); border: 1px solid var(--line); }
.kpi .num.bad { color: var(--danger); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .grid3 { grid-template-columns: 1fr; } }
details.steps { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
details.steps summary { cursor: pointer; font-weight: 700; }
details.steps ol { margin: 8px 0 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.sk { border-radius: 14px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.heat td.hm { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; min-width: 44px; border: 2px solid var(--surface); }
.heat th, .heat td { white-space: nowrap; }
.insight-line { color: var(--ink); background: var(--info-soft); border-radius: 10px; padding: 8px 10px; margin: 2px 0 10px; }
.insight-line b { color: var(--info); }
.insight { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.insight:last-child { border-bottom: 0; }
.insight b.tag { flex: none; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--info-soft); color: var(--info); }
.insight b.tag.warn { background: var(--gold-soft); color: var(--gold); }
.insight b.tag.bad { background: var(--danger-soft); color: var(--danger); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 0 0 auto; width: 260px; z-index: 45; transform: translateX(110%); transition: transform .25s; height: 100%; }
  .side.open { transform: none; box-shadow: var(--shadow); }
  .mobile-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .main { padding: 14px 16px 40px; }
  .charts > .card, .charts > .card.third { grid-column: span 12; }
  .grid2 { grid-template-columns: 1fr; }
  .filters input[type=search] { min-width: 0; width: 100%; }
}
/* Phones: every table turns into a stack of cards, label on the right, value on the left. */
@media (max-width: 700px) {
  .tbl-wrap:has(table.rc) { border: 0; overflow: visible; }
  table.rc thead { display: none; }
  table.rc, table.rc tbody, table.rc tr, table.rc td { display: block; width: 100%; }
  table.rc tr { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; margin-bottom: 10px; position: relative; }
  table.rc td { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 7px 0; border-top: 1px solid var(--line); text-align: end; }
  table.rc td:first-child { border-top: 0; }
  table.rc td::before { content: attr(data-label); color: var(--muted); font-size: 12px; flex: none; text-align: start; padding-top: 1px; }
  table.rc td[data-label=""] { justify-content: flex-start; }
  table.rc td[data-label=""]::before { display: none; }
  table.rc td:has(> input[data-pick]) { border: 0; padding: 4px 0 0; }
  table.rc td > .v { text-align: end; min-width: 0; }

<script>
(function () {
  'use strict';
  document.documentElement.setAttribute('dir', 'rtl');
  document.documentElement.setAttribute('lang', 'ar');

  /* ─────────────── Backend: the /exec link, or the demo ─────────────── */
  var API_URL = window.FS_API_URL || '';
  var live = !!API_URL && !window.FS_ADMIN_DEMO;
  var OFFLINE = { ok: false, error: 'مافيش اتصال بالسيرفر. اتأكد من النت وجرّب تاني.' };
  var Backend = live ? {
    call: function (action, payload) {
      return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, payload: payload }), redirect: 'follow' })
        .then(function (r) { return r.json(); }).catch(function () { return OFFLINE; });
    }
  } : window.FS_ADMIN_DEMO;

  var S = { token: null, me: null, data: null, view: 'overview', range: 'season', source: 'all', zone: '', sv: '', svView: 'rider', drafts: {} };
  var root = document.getElementById('root');
  var charts = [];

  /* ─────────────── Helpers ─────────────── */
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function money(n) { return Number(n || 0).toLocaleString('en-US'); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function day(s) { if (!s) return null; if (s instanceof Date) return s; var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var DF = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' });
  var DFY = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', year: 'numeric' });
  function fmt(s, y) { var d = day(s); return d ? (y ? DFY : DF).format(d) : '—'; }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function diff(a, b) { return Math.round((day(b) - day(a)) / 864e5); }
  function icon(id) { return '<svg aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
  function intl(p) { var d = String(p || '').replace(/\D/g, ''); return d.length === 11 && d[0] === '0' ? '20' + d.slice(1) : d; }
  function wa(p, t) { return 'https://wa.me/' + intl(p) + (t ? '?text=' + encodeURIComponent(t) : ''); }
  function cleanName(n) { return String(n || '').replace(/\s*_?FULL\s*SPEED(_BC)?\s*$/i, '').trim(); }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  var tt;
  function toast(m, bad) { var t = document.getElementById('toast'); t.textContent = m; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast'; }, 3200); }

  async function call(action, payload) {
    payload = payload || {}; payload.token = S.token;
    var res = await Backend.call(action, payload);
    if (!res || typeof res !== 'object') res = OFFLINE;
    if (!res.ok && res.error === 'SESSION_EXPIRED') { signOut(); toast('انتهت الجلسة، ادخل تاني.', true); }
    else if (!res.ok) toast(res.error, true);
    return res;
  }
  function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.l = btn.innerHTML; btn.textContent = 'لحظة…'; } else if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }
  function formData(f) { var o = {}; new FormData(f).forEach(function (v, k) { o[k] = String(v).trim(); }); return o; }
  function showErrors(f, fields) {
    f.querySelectorAll('.err').forEach(function (e) { e.remove(); });
    Object.keys(fields || {}).forEach(function (k) { var i = f.querySelector('[name="' + k + '"]'); if (!i) return; var e = document.createElement('div'); e.className = 'err'; e.textContent = fields[k]; i.closest('.field').appendChild(e); });
  }
  function can(p) { return S.me && S.me.can && S.me.can[p]; }
  function csv(name, rows) {
    var text = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c === null || c === undefined ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name + '-' + iso(new Date()) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ─────────────── Theme ─────────────── */
  if (store('fs_theme')) document.documentElement.setAttribute('data-theme', store('fs_theme'));
  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    var next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next); store('fs_theme', next); render();
  }

  /* ─────────────── Login ─────────────── */
  function brand() { return '<div class="brand"><i class="mk"></i><span class="wm">Full<b>speed</b></span></div>'; }
  function renderLogin() {
    root.innerHTML = '<div class="login"><form class="card" id="loginForm" novalidate>' + brand() +
      '<p class="muted" style="text-align:center;margin:0">لوحة إدارة برنامج الترشيحات</p>' +
      (live ? '' : '<div class="demo-flag">نسخة تجريبية — اكتب أي اسم مستخدم وكلمة مرور</div>') +
      '<div class="field"><label for="l-u">اسم المستخدم</label><input id="l-u" name="username" class="ltr" autocomplete="username" required></div>' +
      '<div class="field"><label for="l-p">كلمة المرور</label><input id="l-p" name="password" type="password" autocomplete="current-password" required></div>' +
      '<button class="btn btn-primary" type="submit" style="min-height:44px">دخول</button></form></div>';
    document.getElementById('loginForm').onsubmit = async function (e) {
      e.preventDefault();
      var btn = e.target.querySelector('[type=submit]'); busy(btn, true);
      var res = await Backend.call('adminLogin', formData(e.target));
      busy(btn, false);
      if (!res.ok) { toast(res.error, true); return; }
      S.token = res.data.token; S.me = res.data.me; store('fs_admin_token', S.token);
      if (S.me.mustChange) renderForceChange(); else load();
    };
  }
  function renderForceChange() {
    root.innerHTML = '<div class="login"><form class="card" id="pwF" novalidate>' + brand() +
      '<h2 style="margin:0;text-align:center;font:800 18px var(--f-display)">اختار كلمة مرور جديدة</h2><p class="muted" style="margin:0;text-align:center">دي أول مرة تدخل بكلمة السر المؤقتة.</p>' +
      '<div class="field"><label>كلمة السر المؤقتة</label><input name="current" type="password" required></div>' +
      '<div class="field"><label>كلمة السر الجديدة (8 على الأقل)</label><input name="next" type="password" autocomplete="new-password" required></div>' +
      '<button class="btn btn-primary" type="submit" style="min-height:44px">حفظ ودخول</button></form></div>';
    document.getElementById('pwF').onsubmit = async function (e) {
      e.preventDefault(); var btn = e.target.querySelector('[type=submit]'); busy(btn, true);
      var res = await call('adminChangePassword', formData(e.target)); busy(btn, false);
      if (!res.ok) { showErrors(e.target, res.fields); return; }
      S.token = res.data.token; S.me = res.data.me; store('fs_admin_token', S.token); load();
    };
  }
  function signOut() { S.token = null; S.data = null; store('fs_admin_token', null); cacheSet(null); renderLogin(); }

  var CACHE = 'fs_admin_cache';
  function cacheGet() { try { return sessionStorage.getItem(CACHE); } catch (e) { return null; } }
  function cacheSet(v) { try { if (v) sessionStorage.setItem(CACHE, v); else sessionStorage.removeItem(CACHE); } catch (e) { /* full or blocked: just skip */ } }
  window.__fsChart = function () { if (S.data) render(); };
  async function load(quiet) {
    if (!quiet && !root.querySelector('.boot')) root.innerHTML = '<div class="layout"><aside class="side"></aside><main class="main"><div class="sk" style="height:60px"></div><div class="kpis">' +
      '<div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div></div><div class="sk" style="height:300px"></div></main></div>';
    var res = await call('adminData');
    if (!res.ok) { if (root.querySelector('.boot') && S.token) renderLogin(); return; }
    if (res.data.me && res.data.me.mustChange) { S.me = res.data.me; renderForceChange(); return; }
    var json = live ? JSON.stringify(res.data) : '';
    if (live && quiet && S.data && json === cacheGet()) return; // nothing changed since the cached copy
    if (live) cacheSet(json);
    S.data = res.data; S.me = res.data.me;
    prepare(S.data);
    render();
  }

  /* Dates from the server arrive as yyyy-MM-dd strings: turn them into Date once. */
  function prepare(d) {
    d.today = day(d.today);
    d.season.start = day(d.season.start);
    d.applicants.forEach(function (a) { a.submitted = day(a.submitted); a.hiredDate = day(a.hiredDate); a.statusUpdated = day(a.statusUpdated); });
    d.riders.forEach(function (r) { ['hireDate', 'lastDay', 'payoutDate', 'appliedOn'].forEach(function (k) { r[k] = day(r[k]); }); });
    d.payouts.forEach(function (p) { p.paidAt = day(p.paidAt); p.approvedAt = day(p.approvedAt); });
    d.usersByKey = {}; d.users.forEach(function (u) { d.usersByKey[u.key] = u; });
  }

  /* ─────────────── Shell ─────────────── */
  var NAV = [
    ['', [['overview', 'لوحة القيادة', 'dash'], ['analytics', 'التحليلات', 'chart'], ['compare', 'المقارنات', 'chart'], ['sv', 'السوبرفايزرز', 'team']]],
    ['التشغيل', [['applicants', 'المرشحين', 'people'], ['riders', 'الطيارين والبونص', 'bike'], ['payouts', 'سجل الصرف', 'money'], ['users', 'المرشِّحين', 'user']]],
    ['التحكم', [['alerts', 'التنبيهات', 'flag'], ['check', 'فحص البيانات', 'log'], ['campaigns', 'الحملات والإعلانات', 'mega'], ['settings', 'الإعدادات', 'gear'], ['team', 'الفريق', 'team'], ['audit', 'سجل التعديلات', 'log']]]
  ];

  function counts() {
    var d = S.data;
    return {
      applicants: d.applicants.filter(function (a) { return a.nudge; }).length,
      riders: d.riders.filter(function (r) { return r.payStatus === 'due'; }).length,
      alerts: d.applicants.filter(function (a) { return a.flags.length; }).length + d.riders.filter(function (r) { return r.flags.length; }).length
    };
  }

  function render() {
    charts.forEach(function (c) { c.destroy(); }); charts = [];
    EXPORTS = {}; EXPORT_N = 0;
    var c = counts();
    var nav = NAV.map(function (g) {
      return (g[0] ? '<div class="nav-group">' + g[0] + '</div>' : '') + g[1].filter(function (n) { return n[0] !== 'team' || S.data.team; }).map(function (n) {
        return '<button class="nav" data-go="' + n[0] + '" aria-current="' + (S.view === n[0] ? 'page' : 'false') + '">' + icon(n[2]) + n[1] + (c[n[0]] ? '<span class="count">' + c[n[0]] + '</span>' : '') + '</button>';
      }).join('');
    }).join('');
    var body = (VIEWS[S.view] || VIEWS.overview)();
    root.innerHTML = '<div class="mobile-top"><button class="btn btn-ghost" id="menuBtn" aria-label="القائمة">' + icon('menu') + '</button>' + brand() + '<span></span></div>' +
      '<div class="layout"><aside class="side" id="side">' +
      '<div class="brand"><i class="mk"></i><span class="wm">Full<b>speed</b><small>لوحة الإدارة</small></span></div>' + nav +
      '<div class="me"><b>' + esc(S.me.name) + '</b><span class="muted">' + esc(S.me.roleLabel) + '</span>' +
      '<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-ghost btn-sm" id="themeBtn" aria-label="الوضع الفاتح والداكن">' + icon('theme') + '</button>' +
      '<button class="btn btn-ghost btn-sm" id="pwBtn">كلمة المرور</button><button class="btn btn-ghost btn-sm" id="outBtn">خروج</button></div></div></aside>' +
      '<main class="main">' + (live ? '' : '<div class="demo-flag">نسخة تجريبية — كل الأسماء والأرقام وهمية</div>') + body + '</main></div>';
    root.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { S.view = b.dataset.go; document.getElementById('side').classList.remove('open'); render(); scrollTo(0, 0); }; });
    document.getElementById('menuBtn').onclick = function () { document.getElementById('side').classList.toggle('open'); };
    document.getElementById('themeBtn').onclick = toggleTheme;
    document.getElementById('outBtn').onclick = function () { call('adminLogout'); signOut(); };
    document.getElementById('pwBtn').onclick = openPassword;
    var r = root.querySelector('[data-refresh]'); if (r) r.onclick = function () { S.check = null; load(true).then(function () { if (S.view === 'check') render(); toast('البيانات اتحدّثت ✓'); }); };
    (BINDERS[S.view] || function () {})();
  }

  function head(title, sub, actions) {
    return '<div class="page-head"><div><h1>' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + (actions || '') +
      '<button class="btn btn-ghost" data-refresh>' + icon('refresh') + 'تحديث</button></div></div>';
  }

  /* ─────────────── Filters for analytic views ─────────────── */
  var RANGES = [['7', '7 أيام'], ['30', '30 يوم'], ['month', 'الشهر ده'], ['season', 'من بداية البرنامج'], ['custom', 'من / لحد']];
  S.from = S.from || ''; S.to = S.to || ''; S.veh = ''; S.batch = ''; S.rst = ''; S.refq = '';
  function rangeStart() {
    var t = S.data.today;
    if (S.range === '7') return addDays(t, -6);
    if (S.range === '30') return addDays(t, -29);
    if (S.range === 'month') return new Date(t.getFullYear(), t.getMonth(), 1);
    if (S.range === 'custom' && S.from) return day(S.from);
    return S.data.season.start;
  }
  function rangeEnd() { return S.range === 'custom' && S.to ? day(S.to) : S.data.today; }
  function inRange(d) { return d && d >= rangeStart() && d <= rangeEnd(); }
  function srcOk(t) { return S.source === 'all' || t === S.source; }
  function zoneOk(z) { return !S.zone || z === S.zone; }
  function svOk(v) { return !S.sv || v === S.sv; }
  var VEH = { 'موتوسيكل': /^(bike|موتوسيكل|hybrid)/i, 'عجلة': /^(bicycle|عجلة)/i, 'مشي': /^(walker|مشي)/i };
  function vehKind(v) { var k = Object.keys(VEH).filter(function (x) { return VEH[x].test(String(v || '').trim()); })[0]; return k || 'غير محدد'; }
  function batchKind(b) { return !b ? 'غير محدد' : b <= 2 ? '1–2 (قوي)' : b <= 4 ? '3–4 (متوسط)' : '5+ (ضعيف)'; }
  function refOk(key, name) { if (!S.refq) return true; var q = S.refq.toLowerCase(); return String(key || '').toLowerCase().indexOf(q) !== -1 || cleanName(name).toLowerCase().indexOf(q) !== -1; }
  /* Rider-level filters (vehicle, batch, status) only apply to hires. */
  function riderOk(r) {
    if (S.veh && vehKind(r.vehicle) !== S.veh) return false;
    if (S.batch && batchKind(r.batch) !== S.batch) return false;
    if (S.rst === 'sp' && r.sp !== true) return false;
    if (S.rst === 'nosp' && r.sp !== false) return false;
    if (S.rst === 'started' && r.started === false) return false;
    if (S.rst === 'notstarted' && r.started !== false) return false;
    return true;
  }
  function activeFilters() { return [S.veh, S.batch, S.rst, S.refq, S.sv, S.zone, S.source !== 'all' ? 1 : ''].filter(Boolean).length; }
  function filterBar() {
    var opt = function (v, cur, label) { return '<option value="' + esc(v) + '"' + (cur === v ? ' selected' : '') + '>' + esc(label || v) + '</option>'; };
    return '<div class="filters"><div class="seg" role="group" aria-label="الفترة">' + RANGES.map(function (r) {

  /* ─────────────── Settings ─────────────── */
  var SETTING_LABELS = [
    ['PROGRAM_START_DATE', 'أول يوم تعيين بيتحسب في البرنامج', 'date'], ['BONUS_WINDOW_MONTHS', 'مدة البونص (شهور من التعيين)', 'number'],
    ['NUDGE_AFTER_DAYS', 'تنبيه متابعة المرشح بعد (أيام)', 'number'], ['COMPANY_REF_CODE', 'كود طلبات الموحّد للشركاء', 'text'],
    ['SUPPORT_WHATSAPP', 'واتساب الدعم (بالكود الدولي: 2011…)', 'text'],
    ['SESSION_DAYS', 'الطيار يفضل مسجل دخول (أيام)', 'number'], ['MAX_LOGIN_FAILURES', 'محاولات غلط قبل القفل', 'number'],
    ['LOCK_MINUTES', 'مدة القفل (دقايق)', 'number'], ['MIN_PASSWORD_LENGTH', 'أقل طول لكلمة سر الطيار', 'number'],
    ['PUBLIC_APPLY_PER_HOUR', 'أقصى طلبات من لينك واحد في الساعة', 'number'], ['PUBLIC_APP_URL', 'لينك التطبيق', 'text']
  ];
  var REPORT_LABELS = [['REPORT_EMAILS', 'الإيميلات (افصل بينهم بفاصلة)', 'text'], ['REPORT_WHATSAPP', 'رقم الواتساب (بالكود الدولي: 2011…)', 'text'], ['CALLMEBOT_APIKEY', 'مفتاح CallMeBot', 'text']];
  function reportCard(d, edit) {
    return '<section class="card wide" style="display:grid;gap:10px"><h2>التقرير اليومي<small>كل يوم الساعة 9 الصبح</small></h2>' +
      '<p class="sub" style="margin:0">أرقام إمبارح، والفلوس المستنية اعتماد وصرف، والمشاكل — بيوصل على الإيميل والواتساب. الواتساب بيوصل أرقام بس، من غير أسماء أو موبايلات.</p>' +
      '<div class="grid3">' + REPORT_LABELS.map(function (s) { return '<div class="field"><label>' + s[1] + '</label><input name="' + s[0] + '" class="ltr" value="' + esc(d.config[s[0]]) + '"' + (edit ? '' : ' disabled') + (s[0] === 'CALLMEBOT_APIKEY' ? ' autocomplete="off" placeholder="الرقم اللي هيوصلك"' : '') + '></div>'; }).join('') + '</div>' +
      '<details class="steps"><summary>إزاي أفعّل الواتساب؟ (مرة واحدة بس)</summary><ol>' +
        '<li>افتح <a href="https://www.callmebot.com/blog/free-api-whatsapp-messages/" target="_blank" rel="noopener">صفحة CallMeBot الرسمية</a> وسجّل رقم الواتساب المكتوب فيها عندك باسم CallMeBot.</li>' +
        '<li>ابعتله على واتساب من رقمك الرسالة دي بالظبط: <b class="ltr">I allow callmebot to send me messages</b></li>' +
        '<li>هيرد عليك في دقيقتين برسالة فيها <b>apikey</b> — حط الرقم ده في خانة "مفتاح CallMeBot" فوق واحفظ.</li>' +
        '<li>دوس "ابعت التقرير دلوقتي" عشان تتأكد إنه وصل.</li></ol>' +
        '<p class="muted" style="margin:6px 0 0;font-size:12px">لأكتر من رقم: كل واحد يفعّل من رقمه، واكتبهم في خانة الرقم كده: <span class="ltr">201120339097:111111, 201000000000:222222</span></p></details>' +
      (edit ? '<div><button type="button" class="btn btn-wa" id="sendRep">' + icon('wa') + 'ابعت التقرير دلوقتي</button> <span class="muted" id="repRes" style="font-size:12px"></span></div>' : '') + '</section>';
  }
  function viewSettings() {
    var d = S.data, edit = can('settings.edit');
    return head('الإعدادات', edit ? 'أي تغيير هنا بيوصل للتطبيق على طول' : 'عرض بس — التعديل للمدير') +
      '<form id="setF" novalidate><div class="charts"><section class="card"><h2>شرايح البونص</h2><p class="sub">عدد الأوردرات المكتملة ← قيمة البونص</p><div id="tiers" style="display:grid;gap:6px">' +
      d.season.tiers.map(tierRow).join('') + '</div>' + (edit ? '<button type="button" class="btn btn-ghost btn-sm" id="addTier" style="margin-top:8px">+ شريحة</button>' : '') + '</section>' +
      '<section class="card" style="display:grid;gap:10px"><h2>البرنامج والأمان</h2>' + SETTING_LABELS.map(function (s) {
        return '<div class="field"><label>' + s[1] + '</label><input name="' + s[0] + '" type="' + s[2] + '" value="' + esc(d.config[s[0]]) + '"' + (edit ? '' : ' disabled') + (s[2] === 'text' && /WHATSAPP|URL|EMAILS|CODE/.test(s[0]) ? ' class="ltr"' : '') + '></div>';
      }).join('') + '</section>' + reportCard(d, edit) + '</div>' + (edit ? '<div style="margin-top:12px"><button class="btn btn-primary" type="submit" style="min-height:42px">حفظ الإعدادات</button></div>' : '') + '</form>';
  }
  function tierRow(t) { return '<div style="display:flex;gap:8px;align-items:center"><input type="number" data-to value="' + t.orders + '" style="width:100px" aria-label="أوردرات"' + (can('settings.edit') ? '' : ' disabled') + '><span class="muted">أوردر ←</span><input type="number" data-tb value="' + t.bonus + '" style="width:110px" aria-label="بونص"' + (can('settings.edit') ? '' : ' disabled') + '><span class="muted">ج</span>' + (can('settings.edit') ? '<button type="button" class="btn btn-ghost btn-sm" data-rmt>✕</button>' : '') + '</div>'; }
  function bindSettings() {
    var f = document.getElementById('setF'); if (!can('settings.edit')) return;
    var bindRm = function () { f.querySelectorAll('[data-rmt]').forEach(function (b) { b.onclick = function () { b.parentNode.remove(); }; }); };
    bindRm();
    document.getElementById('addTier').onclick = function () { document.getElementById('tiers').insertAdjacentHTML('beforeend', tierRow({ orders: '', bonus: '' })); bindRm(); };
    document.getElementById('sendRep').onclick = async function (e) {
      var b = e.currentTarget; busy(b, true); document.getElementById('repRes').textContent = 'بيتبعت… (احفظ الإعدادات الأول لو غيّرت حاجة)';
      var res = await call('adminSendReport', {}); busy(b, false);
      document.getElementById('repRes').textContent = res.ok ? res.data.result.join(' · ') : '';
    };
    f.querySelectorAll('#tiers input').forEach(function (i) { i.style.cssText += ';min-height:34px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-2);padding:4px 8px'; });
    f.onsubmit = async function (e) {
      e.preventDefault();
      var cfg = {}; SETTING_LABELS.concat(REPORT_LABELS).forEach(function (s) { cfg[s[0]] = f[s[0]].value; });
      var tiers = Array.prototype.map.call(f.querySelectorAll('#tiers > div'), function (r) { return { orders: r.querySelector('[data-to]').value, bonus: r.querySelector('[data-tb]').value }; });
      var b = f.querySelector('[type=submit]'); busy(b, true); var res = await call('adminSaveSettings', { config: cfg, tiers: tiers }); busy(b, false);
      if (!res.ok) { showErrors(f, res.fields); return; }
      toast('اتحفظت ✓'); load(true);
    };
  }

  /* ─────────────── Team ─────────────── */
  function viewTeam() {
    var d = S.data;
    if (!d.team) return head('الفريق') + '<div class="empty">الصفحة دي للمدير بس.</div>';
    return head('الفريق', 'مين يدخل لوحة الإدارة وصلاحيات كل واحد', '<button class="btn btn-primary" id="addM">+ عضو جديد</button>') +
      '<section class="card"><h2>الأدوار</h2><div class="kv"><span>مدير</span><span>كل حاجة</span></div><div class="kv"><span>فريق التعيينات</span><span>المرشحين + حسابات الطيارين</span></div><div class="kv"><span>الحسابات</span><span>البونص والصرف</span></div><div class="kv"><span>مشاهد</span><span>يشوف بس</span></div></section>' +
      table([['الاسم'], ['اسم المستخدم'], ['الدور'], ['الحالة'], ['آخر دخول', 'n'], ['']], d.team.map(function (m) {
        var me = m.username === S.me.username;
        return [esc(m.name), '<span class="ltr">' + esc(m.username) + '</span>',
          me ? esc(d.roles[m.role]) : '<select data-role="' + esc(m.username) + '">' + Object.keys(d.roles).map(function (r) { return '<option value="' + r + '"' + (r === m.role ? ' selected' : '') + '>' + d.roles[r] + '</option>'; }).join('') + '</select>',
          '<span class="pill ' + (m.status === 'active' ? 'green' : 'red') + '">' + (m.status === 'active' ? 'فعّال' : 'موقوف') + '</span>' + (m.mustChange ? ' <span class="pill dim">لسه بكلمة سر مؤقتة</span>' : ''),
          m.lastLogin ? fmt(m.lastLogin) : '—',
          me ? '<span class="muted">إنت</span>' : '<button class="btn btn-ghost btn-sm" data-tm="reset" data-u="' + esc(m.username) + '">كلمة سر مؤقتة</button> <button class="btn ' + (m.status === 'active' ? 'btn-danger' : 'btn-primary') + ' btn-sm" data-tm="' + (m.status === 'active' ? 'disable' : 'enable') + '" data-u="' + esc(m.username) + '">' + (m.status === 'active' ? 'أوقف' : 'فعّل') + '</button>'];
      }));
  }
  function bindTeam() {
    var a = document.getElementById('addM');
    if (a) a.onclick = function () {
      var o = overlay(dhead('عضو جديد في الفريق') + '<form id="mF" style="display:grid;gap:10px" novalidate>' +
        '<div class="field"><label>الاسم</label><input name="name"></div><div class="field"><label>اسم المستخدم (إنجليزي)</label><input name="username" class="ltr" placeholder="sara"></div>' +
        '<div class="field"><label>الدور</label><select name="role">' + Object.keys(S.data.roles).map(function (r) { return '<option value="' + r + '"' + (r === 'recruiter' ? ' selected' : '') + '>' + S.data.roles[r] + '</option>'; }).join('') + '</select></div>' +
        '<button class="btn btn-primary" type="submit">إضافة</button><div id="mOut"></div></form>', true);
      o.querySelector('#mF').onsubmit = async function (e) {
        e.preventDefault(); var fd = formData(e.target); fd.action = 'add';
        var res = await call('adminTeam', fd); if (!res.ok) { showErrors(e.target, res.fields); return; }
        o.querySelector('#mOut').innerHTML = '<p class="muted" style="margin:0">ابعتله البيانات دي — هيغير كلمة السر أول ما يدخل:</p><div class="secret">' + esc(fd.username) + ' / ' + esc(res.data.temp) + '</div>';
        e.target.querySelector('[type=submit]').remove(); load(true);
      };
    };
    root.querySelectorAll('[data-role]').forEach(function (s) { s.onchange = async function () { var res = await call('adminTeam', { action: 'role', username: s.dataset.role, role: s.value }); if (res.ok) { toast('اتغير ✓'); load(true); } }; });
    root.querySelectorAll('[data-tm]').forEach(function (b) { b.onclick = async function () {
      var res = await call('adminTeam', { action: b.dataset.tm, username: b.dataset.u }); if (!res.ok) return;
      if (res.data.temp) overlay(dhead('كلمة سر مؤقتة') + '<div class="secret">' + esc(b.dataset.u) + ' / ' + esc(res.data.temp) + '</div><p class="muted">هيغيرها أول ما يدخل.</p>', true);
      else toast('تم ✓');
      load(true);
    }; });
  }

  /* ─────────────── Audit ─────────────── */
  S.auq = '';
  function viewAudit() {
    var q = S.auq.toLowerCase();
    var items = S.data.audit.filter(function (x) { return !q || (x.by + ' ' + x.action + ' ' + x.target + ' ' + x.before + ' ' + x.after).toLowerCase().indexOf(q) !== -1; });
    return head('سجل التعديلات', 'آخر 400 تعديل من لوحة الإدارة — مين عمل إيه وإمتى') +
      '<div class="filters"><input type="search" id="auq" placeholder="بحث بالاسم أو العملية" value="' + esc(S.auq) + '"></div>' +
      list('audit', [
        { t: 'الوقت', k: 'at', c: 'n', v: function (x) { var d = new Date(x.at); return isNaN(d) ? esc(x.at) : DFY.format(d) + ' ' + d.toLocaleTimeString('ar-EG-u-nu-latn', { hour: '2-digit', minute: '2-digit' }); } },
        { t: 'المسؤول', k: 'by', v: function (x) { return esc(x.by); } },
        { t: 'العملية', k: 'action', v: function (x) { return '<b>' + esc(x.action) + '</b>'; } },
        { t: 'على', k: 'target', v: function (x) { return esc(x.target); } },
        { t: 'قبل ← بعد', v: function (x) { return (x.before || x.after) ? '<span class="muted">' + esc(x.before || '—') + '</span> ← ' + esc(x.after || '—') : ''; } }
      ], items, { name: 'سجل-التعديلات', id: function (x) { return x.at; }, empty: 'لسه مفيش تعديلات.' });
  }
  function bindAudit() {
    var deb; document.getElementById('auq').oninput = function (e) { clearTimeout(deb); deb = setTimeout(function () { S.auq = e.target.value; render(); var i = document.getElementById('auq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
    bindList('audit', {});
  }

  function openPassword() {
    var o = overlay(dhead('تغيير كلمة المرور') + '<form id="cpF" style="display:grid;gap:10px" novalidate><div class="field"><label>الحالية</label><input name="current" type="password"></div>' +
      '<div class="field"><label>الجديدة (8 على الأقل)</label><input name="next" type="password" autocomplete="new-password"></div><button class="btn btn-primary" type="submit">حفظ</button></form>', true);
    o.querySelector('#cpF').onsubmit = async function (e) {
      e.preventDefault(); var res = await call('adminChangePassword', formData(e.target));
      if (!res.ok) { showErrors(e.target, res.fields); return; }
      S.token = res.data.token; store('fs_admin_token', S.token); closeOverlay(); toast('اتغيرت ✓');
    };
  }

  var VIEWS = { overview: viewOverview, analytics: viewAnalytics, compare: viewCompare, check: viewCheck, rider: viewRider, sv: viewSV, applicants: viewApplicants, riders: viewRiders, payouts: viewPayouts, users: viewUsers, alerts: viewAlerts, campaigns: viewCampaigns, settings: viewSettings, team: viewTeam, audit: viewAudit };
  var BINDERS = { overview: bindOverview, analytics: bindAnalytics, compare: bindCompare, check: bindCheck, rider: bindRider, sv: bindSV, applicants: bindApplicants, riders: bindRiders, payouts: bindPayouts, users: bindUsers, alerts: bindAlerts, campaigns: bindCampaigns, settings: bindSettings, team: bindTeam, audit: bindAudit };

  /* ─────────────── Start ─────────────── */
  (async function () {
    var token = store('fs_admin_token');
    if (!token) { renderLogin(); return; }
    S.token = token;
    // Same browser session: show the last data instantly, then refresh quietly.
    var cached = live && cacheGet();
    if (cached) { try { S.data = JSON.parse(cached); S.me = S.data.me; prepare(S.data); render(); load(true); return; } catch (e) { cacheSet(null); } }
    load();
  })();
})();
</script>
