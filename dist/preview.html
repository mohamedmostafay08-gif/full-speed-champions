/* Layout: one phone-width column built for the thumb. Summary first (the
   money, in gold), then one clear next step, then the team as order slips.
   A dock with a raised "رشّح" button sits in thumb reach. Dark-first, same
   palette and type as the Full Speed site. */
:root {
  --bg: #070A08; --bg-2: #0B120D; --surface: #0F1912; --surface-2: #13201A;
  --line: #1D2C21; --line-2: #2A3E2F;
  --ink: #DCF0E0; --muted: #94AC99; --dim: #5F7265;
  --green: #34B24C; --green-hi: #5BD06F; --on-green: #04140A; --green-soft: rgba(52,178,76,.13);
  --gold: #E2A838; --gold-hi: #F4C86A; --gold-soft: rgba(226,168,56,.13); --on-gold: #1A1204;
  --danger: #FF7A6E; --danger-soft: rgba(255,122,110,.12);
  --info: #7DB8FF; --info-soft: rgba(125,184,255,.12);
  --shadow: 0 18px 40px -22px rgba(0,0,0,.85);
  --f-display: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --ease: cubic-bezier(.16,1,.3,1);
  --tap: 44px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F4F6F3; --bg-2: #EBF1EA; --surface: #FFFFFF; --surface-2: #F2F8F3;
  --line: #DCE5DB; --line-2: #C4D2C4;
  --ink: #0C150E; --muted: #46594B; --dim: #7A9180;
  --green: #187A31; --green-hi: #136B2A; --on-green: #FFFFFF; --green-soft: rgba(24,122,49,.09);
  --gold: #946609; --gold-hi: #B07A0B; --gold-soft: rgba(148,102,9,.1); --on-gold: #FFFFFF;
  --danger: #C2362B; --danger-soft: rgba(194,54,43,.08);
  --info: #1F5FAD; --info-soft: rgba(31,95,173,.08);
  --shadow: 0 14px 32px -20px rgba(12,40,20,.28);
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #F4F6F3; --bg-2: #EBF1EA; --surface: #FFFFFF; --surface-2: #F2F8F3;
  --line: #DCE5DB; --line-2: #C4D2C4;
  --ink: #0C150E; --muted: #46594B; --dim: #7A9180;
  --green: #187A31; --green-hi: #136B2A; --on-green: #FFFFFF; --green-soft: rgba(24,122,49,.09);
  --gold: #946609; --gold-hi: #B07A0B; --gold-soft: rgba(148,102,9,.1); --on-gold: #FFFFFF;
  --danger: #C2362B; --danger-soft: rgba(194,54,43,.08);
  --info: #1F5FAD; --info-soft: rgba(31,95,173,.08);
  --shadow: 0 14px 32px -20px rgba(12,40,20,.28);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { direction: rtl; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 2px; }
.num { font-family: var(--f-num); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.shell { max-width: 480px; margin: 0 auto; padding-block: 8px calc(118px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.wm { font-family: var(--f-num); font-weight: 800; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.wm b { color: var(--green); font-weight: 800; }
.wm small { display: block; font: 600 10px/1.4 var(--f-body); letter-spacing: .22em; color: var(--muted); margin-top: 3px; }

/* ── Top bar ── */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
.topbar .brand { min-width: 0; }
.topbar .mk { width: 36px; height: 36px; }
.hello { font: 700 16px/1.25 var(--f-display); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hello small { display: block; font: 500 12px var(--f-body); color: var(--muted); }
.icons { display: flex; gap: 6px; flex: none; }
.icon-btn { width: var(--tap); height: var(--tap); border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn[aria-busy="true"] svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/**
 * Full Speed — Core logic.
 *
 * Pure functions only: no SpreadsheetApp / CacheService calls here, so the
 * same file runs in Apps Script (V8) and in Node for the test suite.
 *
 * Contents:
 *   1. Dates      — tolerant parsing of sheet values, calendar-month math
 *   2. Identity   — Egyptian phone numbers and national IDs
 *   3. Bonus      — tiers and per-referral evaluation
 *   4. Duplicates — "is this candidate really new to Full Speed?"
 */

var DAY_MS = 24 * 60 * 60 * 1000;

/* ───────────────────────────── 1. Dates ───────────────────────────── */

var MONTHS_ = {
  jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5,
  jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11
};

/** Strips the time part, keeping the local calendar day. */
function dateOnly(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

/** Whole calendar days from a to b (b - a). Rounds to survive DST shifts. */
function diffDays(a, b) {
  return Math.round((dateOnly(b) - dateOnly(a)) / DAY_MS);
}

/** Builds a date and rejects impossible ones such as 31 February. */
function makeDate_(y, m, d) {
  var dt = new Date(y, m, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m || dt.getDate() !== d) return null;
  return dt;
}

function fullYear_(y) {
  y = parseInt(y, 10);
  return y < 100 ? 2000 + y : y;
}

/**
 * Turns whatever is in a sheet cell into a date (time stripped), or null.
 *
 * Handles: Date objects, Sheets serial numbers, "2026-11-08",
 * "8-Nov", "8 Nov 2026", "8-Nov-26", "11/4/2026 17:25:30".
 *
 * Dates written without a year ("8-Nov", as Talabat exports them) get the
 * most recent year that does not put them in the future, so "1-Jan" read on
 * 5 Jan 2027 is 2027, not 2026.
 *
 * opts.today       reference day for year inference (default: now)
 * opts.slashOrder  'MDY' or 'DMY' for ambiguous "4/11/2026" (default 'MDY',
 *                  matching the sheet's US locale)
 */
function parseSheetDate(value, opts) {
  opts = opts || {};
  if (value === null || value === undefined || value === '') return null;

  if (Object.prototype.toString.call(value) === '[object Date]') {
    return isNaN(value.getTime()) ? null : dateOnly(value);
  }

  if (typeof value === 'number') {
    // Google Sheets serial day (days since 1899-12-30).
    if (value < 20000 || value > 80000) return null;
    var u = new Date(Math.round((value - 25569) * DAY_MS));
    return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate());
  }

  var s = String(value).trim().replace(/[T\s]+\d{1,2}:\d{2}(:\d{2})?.*$/, '');
  var m;

  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return makeDate_(+m[1], +m[2] - 1, +m[3]);

  m = s.match(/^(\d{1,2})[\s\-\/]+([A-Za-z]{3,})\.?(?:[\s\-\/,]+(\d{2,4}))?$/);
  if (m) {
    var mon = MONTHS_[m[2].slice(0, 3).toLowerCase()];
    if (mon === undefined) return null;
    if (m[3]) return makeDate_(fullYear_(m[3]), mon, +m[1]);
    return inferYear_(mon, +m[1], opts.today);
  }

  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    var a = +m[1], b = +m[2], y = fullYear_(m[3]);
    var order = a > 12 ? 'DMY' : b > 12 ? 'MDY' : (opts.slashOrder || 'MDY');
    return order === 'DMY' ? makeDate_(y, b - 1, a) : makeDate_(y, a - 1, b);
  }

  return null;
}

function inferYear_(month, day, today) {
  var ref = dateOnly(today || new Date());
  var d = makeDate_(ref.getFullYear(), month, day);
  // A few days of slack so a hire entered slightly early isn't pushed back a year.
  if (d && diffDays(ref, d) > 7) d = makeDate_(ref.getFullYear() - 1, month, day);
  return d;
}

/* ──────────────────────────── 2. Identity ─────────────────────────── */

/**
 * Canonical Egyptian mobile: "01XXXXXXXXX", or null if it isn't one.
 * Accepts 1148005931 (leading zero lost in the sheet), +201148005931,
 * 00201148005931, "0114 800 5931" …
 */
function canonicalPhone(raw) {
  var d = String(raw === null || raw === undefined ? '' : raw).replace(/\D/g, '');
  if (d.indexOf('0020') === 0) d = d.slice(4);
  else if (d.indexOf('20') === 0 && d.length === 12) d = d.slice(2);
  if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1);
  return /^1[0125]\d{8}$/.test(d) ? '0' + d : null;
}

/** "01148005931" → "201148005931" for wa.me / tel: links. */
function internationalPhone(canonical) {
  return canonical ? '20' + canonical.slice(1) : '';
}

var GOVERNORATE_CODES_ = {
  '01': 'القاهرة', '02': 'الإسكندرية', '03': 'بورسعيد', '04': 'السويس',
  '11': 'دمياط', '12': 'الدقهلية', '13': 'الشرقية', '14': 'القليوبية',
  '15': 'كفر الشيخ', '16': 'الغربية', '17': 'المنوفية', '18': 'البحيرة',
  '19': 'الإسماعيلية', '21': 'الجيزة', '22': 'بني سويف', '23': 'الفيوم',
  '24': 'المنيا', '25': 'أسيوط', '26': 'سوهاج', '27': 'قنا', '28': 'أسوان',
  '29': 'الأقصر', '31': 'البحر الأحمر', '32': 'الوادي الجديد', '33': 'مطروح',
  '34': 'شمال سيناء', '35': 'جنوب سيناء', '88': 'خارج الجمهورية'
};

/**
 * Parses an Egyptian national ID. Returns null unless the embedded birth
 * date and governorate code are real — catches most typos, not just length.
 */
function parseNationalId(raw) {
  var s = String(raw === null || raw === undefined ? '' : raw).replace(/\D/g, '');
  if (!/^[23]\d{13}$/.test(s)) return null;

  var century = s.charAt(0) === '2' ? 1900 : 2000;
  var birth = makeDate_(century + +s.slice(1, 3), +s.slice(3, 5) - 1, +s.slice(5, 7));
  var gov = s.slice(7, 9);
  if (!birth || !GOVERNORATE_CODES_[gov]) return null;

  return {
    id: s,
    birthDate: birth,
    governorate: GOVERNORATE_CODES_[gov],
    gender: (+s.charAt(12)) % 2 === 1 ? 'male' : 'female'
  };
}

/** Age in whole years on a given day. */
function ageOn(birthDate, day) {
  var age = day.getFullYear() - birthDate.getFullYear();
  var hadBirthday = day.getMonth() > birthDate.getMonth() ||
    (day.getMonth() === birthDate.getMonth() && day.getDate() >= birthDate.getDate());
  return hadBirthday ? age : age - 1;
}

/* ───────────────────────────── 3. Bonus ───────────────────────────── */

/** 250→600, +50 orders → +200 EGP, up to 850→3000 (the November poster). */
function buildLinearTiers(firstOrders, stepOrders, firstBonus, stepBonus, maxOrders) {
  var tiers = [];
  for (var o = firstOrders, b = firstBonus; o <= maxOrders; o += stepOrders, b += stepBonus) {
    tiers.push({ orders: o, bonus: b });
  }
  return tiers;
}

var DEFAULT_TIERS = buildLinearTiers(250, 50, 600, 200, 850);
var DEFAULT_WINDOW_MONTHS = 2;

/** Tier reached for an order count. tiers must be sorted ascending. */
function tierFor(orders, tiers) {
  var current = null, next = null;
  for (var i = 0; i < tiers.length; i++) {
    if (orders >= tiers[i].orders) current = tiers[i];
    else { next = tiers[i]; break; }
  }
  return { current: current, next: next, bonus: current ? current.bonus : 0 };
}

/**
 * Last day whose orders still count, for a window of N calendar months.
 *   hired 8 Nov  → counts through 7 Jan
 *   hired 1 Nov  → counts through 31 Dec
 *   hired 31 Dec → counts through end of February (no 31 Feb)
 */
function lastBonusDay(hireDate, months) {
  var y = hireDate.getFullYear(), m = hireDate.getMonth() + months, d = hireDate.getDate();
  var monthLength = new Date(y, m + 1, 0).getDate();
  if (d > monthLength) return new Date(y, m, monthLength);
  return new Date(y, m, d - 1);
}

/**
 * Evaluates one referred rider.
 *
 * input.hireDate     Date
 * input.dailyOrders  [{ date: Date, orders: number }] completed orders per day
 * input.today        Date
 * input.tiers        optional, defaults to DEFAULT_TIERS
 * input.windowMonths optional, defaults to 2
 *
 * Only orders inside the window count, so the bonus freezes at whatever was
 * reached by the last day — it never drops to zero afterwards, and orders
 * made after the window can never push it up.
 *
 * state: 'upcoming' (hire date in the future) | 'active' | 'maxed' | 'closed'
 */
function evaluateReferral(input) {
  var tiers = input.tiers || DEFAULT_TIERS;
  var months = input.windowMonths || DEFAULT_WINDOW_MONTHS;
  var maxTier = tiers[tiers.length - 1];
  var hire = dateOnly(input.hireDate);
  var today = dateOnly(input.today || new Date());
  var lastDay = lastBonusDay(hire, months);

  var days = (input.dailyOrders || [])
    .filter(function (r) { return r && r.date && r.date >= hire && r.date <= lastDay; })
    .sort(function (a, b) { return a.date - b.date; });

  var orders = 0, maxReachedOn = null;
  for (var i = 0; i < days.length; i++) {
    var n = Math.max(0, Math.floor(Number(days[i].orders) || 0));
    orders += n;
    if (!maxReachedOn && orders >= maxTier.orders) maxReachedOn = dateOnly(days[i].date);
  }

  // No daily breakdown: fall back to a single total typed by hand into the
  // riders tab. We then know *that* the max was reached, but not the day.
  var manual = !days.length && input.totalOrders !== undefined && input.totalOrders !== null && input.totalOrders !== '';
  if (manual) orders = Math.max(0, Math.floor(Number(input.totalOrders) || 0));
  var reachedMax = orders >= maxTier.orders;
  if (manual && reachedMax && !maxReachedOn) maxReachedOn = today < lastDay ? today : lastDay;

  var t = tierFor(orders, tiers);
  var state;
  if (today < hire) state = 'upcoming';
  else if (reachedMax) state = 'maxed';
  else if (today > lastDay) state = 'closed';
  else state = 'active';

  var floor = t.current ? t.current.orders : 0;
  var progress = t.next ? (orders - floor) / (t.next.orders - floor) : 1;

  return {
    hireDate: hire,
    lastDay: lastDay,
    orders: orders,
    bonus: t.bonus,
    currentTier: t.current,
    nextTier: t.next,
    ordersToNext: t.next ? t.next.orders - orders : 0,
    progress: Math.max(0, Math.min(1, progress)),
    state: state,
    // 0 means today is the last counting day.
    daysLeft: state === 'active' ? diffDays(today, lastDay) : (state === 'upcoming' ? diffDays(hire, lastDay) : 0),
    maxReachedOn: maxReachedOn,
    // Paid once the window ends, or early when the maximum is reached.
    payoutDate: maxReachedOn || addDays(lastDay, 1),
    ordersSource: manual ? 'manual' : 'daily'

}

/** For the simulator: riders × average orders, same tiers as the real thing. */
function simulateBonus(riderCount, avgOrders, tiers) {
  var per = tierFor(Math.max(0, Math.floor(avgOrders || 0)), tiers || DEFAULT_TIERS).bonus;
  return { perRider: per, total: per * Math.max(0, Math.floor(riderCount || 0)) };
}

/* ─────────────────────────── 4. Duplicates ────────────────────────── */

/**
 * Builds a lookup of every phone / national ID Full Speed already knows.
 *
 * records: [{ source: 'Headcount' | 'Normal Riders Handle' | 'New Applicants' | …,
 *             phone, nationalId, label }]
 */
function buildIdentityIndex(records) {
  var index = {};
  function add(key, rec) {
    if (!key) return;
    (index[key] = index[key] || []).push({ source: rec.source, label: rec.label || '' });
  }
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    var phone = canonicalPhone(r.phone);
    var nid = parseNationalId(r.nationalId);
    add(phone && 'p:' + phone, r);
    add(nid && 'n:' + nid.id, r);
  }
  return index;
}

/**
 * Everything that matches the candidate. Empty array = genuinely new.
 * Any match blocks the submission: the rule is "new to Full Speed".
 */
function findDuplicates(candidate, index) {
  var hits = [];
  var phone = canonicalPhone(candidate.phone);
  var nid = parseNationalId(candidate.nationalId);
  (phone && index['p:' + phone] || []).forEach(function (h) {
    hits.push({ field: 'phone', source: h.source, label: h.label });
  });
  (nid && index['n:' + nid.id] || []).forEach(function (h) {
    hits.push({ field: 'nationalId', source: h.source, label: h.label });
  });

}

/* ───────────────────────── Text normalisation ─────────────────────── */

/** Folds Arabic spelling variants so "المحاضره" equals "المحاضرة". */
function normalizeArabic(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/[ً-ْـ]/g, '')   // harakat + tatweel
    .replace(/[إأآ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .trim();
}

/** Header key: case, whitespace and punctuation don't matter. */
function headerKey(s) {
  return normalizeArabic(s).toLowerCase().replace(/[\s_\-?:().\/]+/g, '');
}

/** { field: columnIndex | -1 } for a header row and a COLUMNS spec. */
function mapHeaders(headerRow, spec) {
  var keys = headerRow.map(headerKey);
  var map = {};
  Object.keys(spec).forEach(function (field) {
    map[field] = -1;
    for (var i = 0; i < spec[field].length; i++) {
      var idx = keys.indexOf(headerKey(spec[field][i]));
      if (idx !== -1) { map[field] = idx; break; }
    }
  });
  return map;
}

/** Sheet values (header row first) → [{ _row, field: value }]. Blank rows skipped. */
function rowsToRecords(values, spec) {
  if (!values || values.length < 1) return [];
  var map = mapHeaders(values[0], spec);
  var out = [];
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (!row || row.every(function (c) { return c === '' || c === null; })) continue;
    var rec = { _row: r + 1 };
    Object.keys(map).forEach(function (f) { rec[f] = map[f] === -1 ? '' : row[map[f]]; });
    out.push(rec);
  }
  return out;
}

function cleanText(v) {
  var s = String(v === null || v === undefined ? '' : v).trim();
  return /^#(REF|N\/A|VALUE|ERROR|NAME)/i.test(s) ? '' : s;
}

/** Codes come back from the sheet as numbers sometimes (5037723 or 5037723.0). */
function cleanCode(v) {
  var s = cleanText(v);
  return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s, 10)) : s;
}

/** Stops "=IMPORTXML(...)" typed in a form from running as a formula. */
function safeCell(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().slice(0, 300);
  return /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
}

/* ──────────────────────────── Statuses ────────────────────────────── */

var STATUS_KEYS_ = null;

/** Any spelling found in the sheet → one of STATUSES (or '' if unknown). */
function normalizeStatus(raw) {
  if (!STATUS_KEYS_) {
    STATUS_KEYS_ = {};
    STATUSES.forEach(function (s) { STATUS_KEYS_[headerKey(s)] = s; });
    Object.keys(LEGACY_STATUS_MAP).forEach(function (k) { STATUS_KEYS_[headerKey(k)] = LEGACY_STATUS_MAP[k]; });
  }
  var key = headerKey(raw);
  if (!key) return STATUSES[0];
  return STATUS_KEYS_[key] || '';
}

/**
 * Closest stage for wording that isn't in the list (typed by hand in the
 * old sheet). Order matters: "شغال مع ال 4pl" is about another company,
 * not about working with us.
 */
function guessStatus(raw) {
  var k = headerKey(raw);
  if (!k) return STATUSES[0];
  if (/[34]pl|شركه(تانيه|اخري)|مكان(تاني|اخر)/.test(k)) return STATUS_REJECTED;
  if (/رفض|مرفوض|معلق|ملغي|الغاء|مش(عايز|مهتم)/.test(k)) return STATUS_REJECTED;
  if (/محاضر/.test(k)) return 'تم حضور المحاضرة';
  if (/تعيين|تعين/.test(k)) return 'قيد التعيين';
  if (/تواصل|كلمناه|اتكلم/.test(k)) return 'تم التواصل';
  if (/شغال|اشتغل|استلم|نزل/.test(k)) return STATUS_HIRED;
  return STATUSES[0];   // استعلام / استمارة / anything else → still at the start
}

/* ───────────────────────────── Config ─────────────────────────────── */

/** Merges "FS Config" rows over CONFIG_DEFAULTS and parses the types. */
function resolveConfig(rows, tierRows) {
  var cfg = {};
  Object.keys(CONFIG_DEFAULTS).forEach(function (k) { cfg[k] = CONFIG_DEFAULTS[k]; });
  (rows || []).forEach(function (r) {
    var k = cleanText(r[0]);
    if (k && Object.prototype.hasOwnProperty.call(CONFIG_DEFAULTS, k) && cleanText(r[1]) !== '') cfg[k] = r[1];
  });
  ['BONUS_WINDOW_MONTHS', 'NUDGE_AFTER_DAYS', 'SESSION_DAYS', 'MAX_LOGIN_FAILURES', 'LOCK_MINUTES',
    'PUBLIC_APPLY_PER_HOUR', 'MIN_PASSWORD_LENGTH'].forEach(function (k) {
    cfg[k] = parseInt(cfg[k], 10) || CONFIG_DEFAULTS[k];
  });
  cfg.COMPANY_REF_CODE = cleanCode(cfg.COMPANY_REF_CODE);
  cfg.PROGRAM_START_DATE = parseSheetDate(cfg.PROGRAM_START_DATE) || parseSheetDate(CONFIG_DEFAULTS.PROGRAM_START_DATE);

  var tiers = (tierRows || [])
    .map(function (r) { return { orders: parseInt(r[0], 10), bonus: parseInt(String(r[1]).replace(/[^\d]/g, ''), 10) }; })
    .filter(function (t) { return t.orders > 0 && t.bonus > 0; })
    .sort(function (a, b) { return a.orders - b.orders; });
  cfg.TIERS = tiers.length ? tiers : DEFAULT_TIERS;
  return cfg;
}

/* ───────────────────────────── World ──────────────────────────────── */

/**
 * Normalises raw tab records into one in-memory picture of the program.
 * raw = { riders, headcount, applicants, dailyOrders, users } (rowsToRecords output)
 */
function buildWorld(raw, cfg, today) {
  var opts = { today: today };

  var riders = (raw.riders || []).map(function (r) {
    return {
      row: r._row,
      code: cleanCode(r.code),
      name: cleanText(r.name),
      zone: cleanText(r.zone),
      phone: canonicalPhone(r.phone),
      vehicle: cleanText(r.vehicle),
      hireDate: parseSheetDate(r.hireDate, opts),
      orders: cleanText(r.orders) === '' ? null : Number(r.orders) || 0,
      referralCode: cleanCode(r.referralCode)
    };
  }).filter(function (r) { return r.code; });

  var headcount = (raw.headcount || []).map(function (h) {
    return {
      code: cleanCode(h.code), name: cleanText(h.name), zone: cleanText(h.zone),
      supervisor: cleanText(h.supervisor), manager: cleanText(h.manager),
      phone: canonicalPhone(h.phone), vehicle: cleanText(h.vehicle), active: cleanText(h.active)
    };
  }).filter(function (h) { return h.code; });

  var applicants = (raw.applicants || []).map(function (a) {
    var nid = parseNationalId(a.nationalId);
    return {
      row: a._row,
      timestamp: parseSheetDate(a.timestamp, opts),
      refCode: cleanText(a.refCode),
      name: cleanText(a.name),
      phone: canonicalPhone(a.phone),
      nationalId: nid ? nid.id : cleanText(a.nationalId).replace(/\D/g, ''),
      zone: cleanText(a.zone),
      rawStatus: cleanText(a.status),
      status: normalizeStatus(a.status) || guessStatus(a.status),
      note: cleanText(a.note),
      statusUpdated: parseSheetDate(a.statusUpdated, opts),
      hiredCode: cleanCode(a.hiredCode)
    };
  });

  var dailyOrders = {};
  (raw.dailyOrders || []).forEach(function (d) {
    var code = cleanCode(d.code), date = parseSheetDate(d.date, opts);
    if (!code || !date) return;
    (dailyOrders[code] = dailyOrders[code] || []).push({ date: date, orders: Number(d.orders) || 0 });
  });

  var ridersByPhone = {}, ridersByCode = {}, headcountByCode = {};
  riders.forEach(function (r) {
    ridersByCode[r.code] = r;
    if (r.phone && !ridersByPhone[r.phone]) ridersByPhone[r.phone] = r;
  });
  headcount.forEach(function (h) { headcountByCode[h.code] = h; });

  // Earliest application per phone decides who referred that person.
  var appsByPhone = {};
  applicants.slice().sort(function (a, b) { return (a.timestamp || 0) - (b.timestamp || 0); })
    .forEach(function (a) { if (a.phone && !appsByPhone[a.phone]) appsByPhone[a.phone] = a; });

  return {
    cfg: cfg, today: dateOnly(today),
    riders: riders, headcount: headcount, applicants: applicants, dailyOrders: dailyOrders,
    ridersByPhone: ridersByPhone, ridersByCode: ridersByCode, headcountByCode: headcountByCode,
    appsByPhone: appsByPhone
  };
}

/* ─────────────────────────── Attribution ──────────────────────────── */

/**
 * The key a user's referrals are stored under:
 * internal riders → their Talabat code, external partners → their phone.
 */
function ownerKey(user) {
  return user.type === 'external' ? canonicalPhone(user.phone || user.code) : cleanCode(user.code);
}

/** Normalises the "Referral Code" cell of an application to an owner key. */
function appOwnerKey(refCode) {
  return canonicalPhone(refCode) || cleanCode(refCode);
}

/**
 * Who gets the bonus for a hired rider.
 *
 * Talabat's own referral code wins — except the shared company code that all
 * external partners use. Riders under that code (or with no code) belong to
 * whoever submitted their application in the program.
 */
function riderOwner(rider, world) {
  if (rider.referralCode && rider.referralCode !== world.cfg.COMPANY_REF_CODE) return rider.referralCode;
  var app = rider.phone && world.appsByPhone[rider.phone];
  return app ? appOwnerKey(app.refCode) : '';
}

/* ──────────────────────────── Dashboard ───────────────────────────── */

function stageIndex(status) {
  var i = STATUSES.indexOf(status);
  return i === -1 ? 0 : i;
}

/** Everything the app shows a signed-in user, in one object. */
function buildDashboard(world, user) {
  var cfg = world.cfg, today = world.today, key = ownerKey(user);
  var start = cfg.PROGRAM_START_DATE;

  // ── Team: hired riders credited to this user ──
  var team = world.riders
    .filter(function (r) { return r.hireDate && r.hireDate >= start && r.code !== key && riderOwner(r, world) === key; })
    .map(function (r) {
      var ev = evaluateReferral({
        hireDate: r.hireDate,
        dailyOrders: world.dailyOrders[r.code] || [],
        totalOrders: r.orders,
        today: today,
        tiers: cfg.TIERS,
        windowMonths: cfg.BONUS_WINDOW_MONTHS
      });
      return {
        code: r.code, name: r.name, zone: r.zone, phone: r.phone, vehicle: r.vehicle,
        hireDate: ev.hireDate, lastDay: ev.lastDay, payoutDate: ev.payoutDate,
        orders: ev.orders, bonus: ev.bonus, state: ev.state, daysLeft: ev.daysLeft,
        ordersToNext: ev.ordersToNext, progress: ev.progress,
        nextBonus: ev.nextTier ? ev.nextTier.bonus : null, nextOrders: ev.nextTier ? ev.nextTier.orders : null
      };
    })
    .sort(function (a, b) {
      var rank = { active: 0, upcoming: 1, maxed: 2, closed: 3 };
      return (rank[a.state] - rank[b.state]) || (a.daysLeft - b.daysLeft) || (b.hireDate - a.hireDate);
    });

  // ── Pipeline: applications submitted for this user ──
  var pipeline = world.applicants
    .filter(function (a) { return appOwnerKey(a.refCode) === key && a.timestamp && a.timestamp >= start; })
    .map(function (a) {
      var hired = a.phone && world.ridersByPhone[a.phone];
      var status = hired ? STATUS_HIRED : (a.status || STATUSES[0]);
      var since = a.statusUpdated || a.timestamp;
      var waiting = diffDays(since, today);
      return {
        name: a.name, phone: a.phone, zone: a.zone, note: a.note,
        submitted: a.timestamp, status: status, rawStatus: a.rawStatus,
        stage: stageIndex(status), rejected: status === STATUS_REJECTED,
        hiredCode: hired ? hired.code : '', hiredDate: hired ? hired.hireDate : null,
        daysWaiting: waiting,
        nudge: status !== STATUS_HIRED && status !== STATUS_REJECTED && waiting >= cfg.NUDGE_AFTER_DAYS
      };
    })
    .sort(function (a, b) { return b.submitted - a.submitted; });

  // ── Totals ──
  var totals = { bonus: 0, payable: 0, pending: 0, orders: 0, riders: team.length, active: 0, maxed: 0, closed: 0 };
  var nextPayout = null;
  team.forEach(function (t) {
    totals.bonus += t.bonus;
    totals.orders += t.orders;
    if (t.state === 'active' || t.state === 'upcoming') { totals.active++; totals.pending += t.bonus; }
    if (t.state === 'maxed') totals.maxed++;
    if (t.state === 'closed') totals.closed++;
    if (t.state === 'maxed' || t.state === 'closed') totals.payable += t.bonus;
    if (t.bonus > 0 && t.payoutDate >= today && (!nextPayout || t.payoutDate < nextPayout)) nextPayout = t.payoutDate;
  });
  totals.nextPayout = nextPayout;
  totals.applicants = pipeline.length;
  totals.nudges = pipeline.filter(function (p) { return p.nudge; }).length;

  return {
    user: buildProfile(world, user),
    team: team,
    pipeline: pipeline,
    totals: totals,
    season: {
      start: start,
      windowMonths: cfg.BONUS_WINDOW_MONTHS,
      tiers: cfg.TIERS,
      nudgeAfterDays: cfg.NUDGE_AFTER_DAYS
    },
    statuses: STATUSES,
    today: today
  };
}

function buildProfile(world, user) {
  var cfg = world.cfg;
  if (user.type === 'external') {
    return {
      type: 'external', code: user.refId || '', name: user.name, phone: canonicalPhone(user.phone || user.code),
      zone: '', supervisor: '', vehicle: '',
      talabatLink: cfg.TALABAT_REF_BASE + cfg.COMPANY_REF_CODE,
      refParam: user.refId || ''
    };
  }
  var code = cleanCode(user.code);
  var h = world.headcountByCode[code] || {};
  var r = world.ridersByCode[code] || {};
  return {
    type: 'internal', code: code,
    name: r.name || h.name || user.name || '',
    phone: r.phone || h.phone || '',
    zone: r.zone || h.zone || '',
    supervisor: h.supervisor || '',
    vehicle: r.vehicle || h.vehicle || '',
    talabatLink: cfg.TALABAT_REF_BASE + code,
    refParam: code
  };
}

/**
 * Applications whose candidate now appears in the riders tab but whose row
 * doesn't say "اشتغل" yet. Returns [{ row, code, hireDate }] for Sheets.js.
 */
function findNewlyHired(world) {
  var out = [];
  world.applicants.forEach(function (a) {
    var r = a.phone && world.ridersByPhone[a.phone];
    if (!r) return;
    if (a.status === STATUS_HIRED && a.hiredCode === r.code) return;

/* ─────────────────────────── Validation ───────────────────────────── */

/**
 * Validates a candidate form. Returns { ok, errors: {field: message}, clean }.
 * world is needed for the "new to Full Speed" rule.
 */
function validateCandidate(form, world) {
  var errors = {};
  var name = cleanText(form.fullName).replace(/\s+/g, ' ');
  var phone = canonicalPhone(form.mobile);
  var nid = parseNationalId(form.nationalId);

  if (name.split(' ').length < 3) errors.fullName = 'اكتب الاسم ثلاثي على الأقل زي البطاقة.';
  if (!phone) errors.mobile = 'رقم موبايل مصري صحيح (11 رقم يبدأ بـ 010 أو 011 أو 012 أو 015).';
  if (!nid) errors.nationalId = 'الرقم القومي غلط — راجع الـ 14 رقم.';
  else {
    var age = ageOn(nid.birthDate, world.today);
    if (age < 18) errors.nationalId = 'السن أقل من 18 سنة حسب الرقم القومي.';
  }
  if (!cleanText(form.address)) errors.address = 'العنوان مطلوب.';
  if (!cleanText(form.zone)) errors.zone = 'اختار منطقة الشغل.';
  var idExp = parseSheetDate(form.idExpiry);
  if (!idExp) errors.idExpiry = 'تاريخ انتهاء البطاقة مطلوب.';
  else if (idExp < world.today) errors.idExpiry = 'البطاقة منتهية.';

  if (!Object.keys(errors).length) {
    var dupes = findDuplicates({ phone: phone, nationalId: nid.id }, identityIndexFor(world));
    if (dupes.length) {
      var d = dupes[0];
      var where = d.source === TABS.APPLICANTS ? 'مترشح قبل كده في البرنامج' : 'مسجل عندنا في Full Speed قبل كده';
      errors[d.field === 'phone' ? 'mobile' : 'nationalId'] =
        (d.field === 'phone' ? 'رقم الموبايل ده ' : 'الرقم القومي ده ') + where + ' — الترشيح لازم يكون لحد جديد.';
    }
  }

  return {
    ok: !Object.keys(errors).length,
    errors: errors,
    clean: {
      name: name, phone: phone, nationalId: nid ? nid.id : '',
      birthDate: nid ? nid.birthDate : null,
      address: cleanText(form.address), zone: cleanText(form.zone),
      licenseExpiry: parseSheetDate(form.licenseExpiry), idExpiry: idExp,
      plate: cleanText(form.plate) || 'عجلة / بدون لوحة'
    }
  };
}

function identityIndexFor(world) {
  if (world._identity) return world._identity;
  var records = [];
  world.headcount.forEach(function (h) { records.push({ source: TABS.HEADCOUNT, phone: h.phone, label: h.code }); });
  world.riders.forEach(function (r) { records.push({ source: TABS.RIDERS, phone: r.phone, label: r.code }); });
  world.applicants.forEach(function (a) { records.push({ source: TABS.APPLICANTS, phone: a.phone, nationalId: a.nationalId, label: a.name }); });
  world._identity = buildIdentityIndex(records);
  return world._identity;
}

<script>
(function () {

  /* ───────────── Backend ─────────────

  var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

    call: function (action, payload) {
      var ctl = window.AbortController ? new AbortController() : null;

        .then(function (r) { return r.json(); })
        .catch(function () { return OFFLINE; })
        .finally(function () { clearTimeout(timer); });
    },
    ref: function () { return Promise.resolve(new URLSearchParams(location.search).get('ref') || ''); }
  } : IS_GAS ? {
    call: function (action, payload) {
      return new Promise(function (resolve) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(function () { resolve(OFFLINE); }).api(action, payload);
      });
    },
    ref: function () {
      return new Promise(function (resolve) {
        google.script.url.getLocation(function (loc) { resolve((loc && loc.parameter && loc.parameter.ref) || ''); });
      });
    }
  } : window.FS_DEMO;

  var S = { token: null, dash: null, boot: null, view: 'home', filter: 'all', ref: '', mode: 'login', type: 'internal' };
  var app = document.getElementById('app');
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ───────────── Helpers ───────────── */
  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function money(n) { return Number(n || 0).toLocaleString('en-US'); }
  function day(s) { if (!s) return null; var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var DF = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'long' });
  var DFY = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });
  function fmtDay(s, withYear) { var d = day(s); return d ? (withYear ? DFY : DF).format(d) : '—'; }
  function intl(phone) { var d = String(phone || '').replace(/\D/g, ''); if (d.length === 11 && d[0] === '0') return '20' + d.slice(1); return d; }
  function cleanName(name) { return String(name || '').replace(/\s*_?FULL\s*SPEED(_BC)?\s*$/i, '').trim(); }
  function first(name) { return cleanName(name).split(/\s+/)[0] || ''; }
  function icon(id) { return '<svg aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
  function wa(phone, text) { return 'https://wa.me/' + (phone ? intl(phone) : '') + (text ? '?text=' + encodeURIComponent(text) : ''); }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
  function plural(n, one, many) { return n === 1 ? one : n + ' ' + many; }

  var toastTimer;
  function toast(msg, bad) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast' + (bad ? ' bad' : ''); }, 3400);
  }

  function copy(text) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('اتنسخ ✓'); } catch (e) { toast('مقدرناش ننسخ، انسخ اللينك من تحت', true); }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('اتنسخ ✓'); }, fallback);
    else fallback();
  }

  /* Egyptian national ID → birth date (same rule as the server) */
  function nidBirth(v) {
    var s = String(v || '').replace(/\D/g, '');
    if (!/^[23]\d{13}$/.test(s)) return null;
    var y = (s[0] === '2' ? 1900 : 2000) + +s.slice(1, 3), m = +s.slice(3, 5) - 1, d = +s.slice(5, 7);
    var dt = new Date(y, m, d);
    return dt.getMonth() === m && dt.getDate() === d ? dt : null;
  }

  async function call(action, payload, opts) {
    var res = await Backend.call(action, payload);
    if (!res || typeof res !== 'object') res = OFFLINE;
    if (!res.ok && res.error === 'SESSION_EXPIRED') { signOut(); toast('انتهت الجلسة، ادخل تاني.', true); return res; }
    if (!res.ok && !(opts && opts.quiet)) toast(res.error, true);
    return res;
  }

  function busy(btn, on, label) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.textContent = label || 'لحظة…'; }
    else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
  }

  function showErrors(form, fields) {
    form.querySelectorAll('.field').forEach(function (f) { f.classList.remove('bad'); var e = f.querySelector('.err'); if (e) e.remove(); });
    var firstBad = null;
    Object.keys(fields || {}).forEach(function (k) {
      var input = form.querySelector('[name="' + k + '"]');
      if (!input) return;
      var f = input.closest('.field'); f.classList.add('bad');
      var e = document.createElement('div'); e.className = 'err'; e.textContent = fields[k]; f.appendChild(e);
      if (!firstBad) firstBad = input;
    });
    if (firstBad) { firstBad.focus({ preventScroll: true }); firstBad.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' }); }
  }
  function formData(form) { var o = {}; new FormData(form).forEach(function (v, k) { o[k] = String(v).trim(); }); return o; }

  /* Numbers count up when a screen opens — the money feels earned. */
  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach(function (el) {
      var to = +el.dataset.count, suffix = el.dataset.suffix || '';
      if (reduced || to < 20) { el.textContent = money(to) + suffix; return; }
      var t0 = performance.now(), dur = 900;
      (function step(t) {
        var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = money(Math.round(to * e)) + suffix;
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    });
    requestAnimationFrame(function () {
      root.querySelectorAll('.track i[data-w]').forEach(function (i) { i.style.width = i.dataset.w + '%'; });
    });
  }

  /* Small confetti burst for real wins (new candidate, a rider hitting the max). */
  function confetti() {
    if (reduced) return;
    var c = document.getElementById('confetti'), ctx = c.getContext('2d');
    var W = c.width = innerWidth, H = c.height = innerHeight;
    var colors = ['#34B24C', '#5BD06F', '#E2A838', '#F4C86A', '#DCF0E0'];
    var parts = Array.from({ length: 110 }, function () {
      return { x: W / 2, y: H * .35, vx: (Math.random() - .5) * 12, vy: Math.random() * -12 - 3, r: Math.random() * 5 + 3,
        c: colors[(Math.random() * colors.length) | 0], a: Math.random() * 6, va: (Math.random() - .5) * .3 };
    });
    c.hidden = false;
    var t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
      });
      if (t - t0 < 1800) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
    })(t0);
  }

  /* ───────────── Theme ───────────── */
  function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); }
  applyTheme(store('fs_theme'));
  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    var next = cur === 'light' ? 'dark' : 'light';
    applyTheme(next); store('fs_theme', next);
  }

  /* ───────────── Auth ───────────── */

  }

  }

  function renderAuth() {
    document.getElementById('dock').hidden = true;
    var ext = S.type === 'external', act = S.mode === 'activate';

        pwField('a-pass', 'اختار كلمة مرور', 'new-password', '6 حروف أو أرقام على الأقل، ومش 123456.');

      fields =
        '<div class="field"><label for="a-code">كود طلبات بتاعك</label><input id="a-code" name="code" class="ltr" inputmode="numeric" enterkeyhint="next" required></div>' +
        '<div class="field"><label for="a-phone">رقم موبايلك المتسجل في الشركة</label><input id="a-phone" name="phone" class="ltr" inputmode="numeric" maxlength="11" enterkeyhint="next" placeholder="01xxxxxxxxx" required><span class="hint">لازم يطابق رقمك عند Full Speed، عشان محدش يفعّل كودك غيرك.</span></div>' +

    app.innerHTML =
      '<section class="auth">' + brand() +
      '<div class="teaser"><p>رشّح طيار جديد وتابعه لحد ما يشتغل</p><span class="num">' + money(top.bonus) + ' <small style="font-size:22px">ج</small></span><strong>لحد كده على كل طيار</strong></div>' +

        '</div>' +
        '<form class="form" id="authForm" novalidate>' + fields +
          '<button class="btn btn-primary btn-block" type="submit">' + (act ? (ext ? 'اعمل حسابك' : 'فعّل حسابك') : 'دخول') + '</button>' +
        '</form>' +
        '<button type="button" class="link-btn" data-mode="' + (act ? 'login' : 'activate') + '">' +

    app.querySelectorAll('[data-type]').forEach(function (b) { b.onclick = function () { S.type = b.dataset.type; renderAuth(); }; });

      d.type = S.type;
      busy(btn, true, act ? 'بنفعّل حسابك…' : 'بندخلك…');
      var res = await call(act ? 'activate' : 'login', d);
      busy(btn, false);
      if (!res.ok) { showErrors(form, res.fields); return; }
      buzz();
      startSession(res.data.token, res.data.dashboard);
      toast(act ? 'أهلاً بيك في Full Speed Champions 🎉' : 'أهلاً يا ' + first(res.data.dashboard.user.name) + ' 👋');
      if (act) confetti();
    };
  }

  function bindPwToggles(root) {
    root.querySelectorAll('.pw-toggle').forEach(function (b) {
      b.onclick = function () {
        var i = b.parentNode.querySelector('input'), show = i.type === 'password';

    app.innerHTML = topbar() + (live ? '' : '<div class="demo-flag">نسخة تجريبية — الأسماء والأرقام وهمية</div>') + '<div class="view">' + body + '</div>';
    document.getElementById('themeBtn').onclick = toggleTheme;
    document.getElementById('refreshBtn').onclick = function () { refresh(); };
    bindView();
    countUp(app);
  }

  async function refresh(quiet) {
    var btn = document.getElementById('refreshBtn');
    if (btn) btn.setAttribute('aria-busy', 'true');
    var res = await call('session', { token: S.token });
    if (btn) btn.removeAttribute('aria-busy');
    if (res.ok) { S.dash = res.data.dashboard; renderApp(); if (!quiet) toast('البيانات اتحدّثت ✓'); celebrateOnce(); }
    return res;
  }

  /* Pull down at the top of the page to refresh. */
  (function pullToRefresh() {
    var ptr = document.getElementById('ptr'), y0 = null, dy = 0, busyNow = false;
    addEventListener('touchstart', function (e) {
      if (!S.dash || busyNow || window.scrollY > 0 || !document.getElementById('sheet').hidden) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      var k = Math.min(1, dy / 90);
      ptr.style.opacity = k; ptr.style.transform = 'translateY(' + (k * 24 - 30) + 'px) scale(' + (.6 + k * .4) + ')';
      ptr.classList.toggle('ready', dy > 90);
    }, { passive: true });
    addEventListener('touchend', async function () {
      if (y0 === null) return;
      y0 = null;
      if (dy > 90) {
        busyNow = true; ptr.classList.add('spin'); buzz();
        await refresh();
        busyNow = false;
      }
      ptr.classList.remove('spin', 'ready'); ptr.style.opacity = 0; ptr.style.transform = '';
    });
  })();

  /* ───────────── Home ───────────── */
  var STATE = {
    active: ['بيتحسب', 'green'], upcoming: ['لسه هيبدأ', 'blue'],
    maxed: ['🏆 قفل الحد الأقصى', 'gold'], closed: ['المدة خلصت', 'dim']
  };

  function encourageMsg(r) {
    var me = first(S.dash.user.name);
    if (r.nextOrders) return 'يا ' + first(r.name) + ' عامل إيه؟ 💪 فاضلك ' + r.ordersToNext + ' أوردر بس وتوصل للشريحة الجاية، وقدامك ' + r.daysLeft + ' يوم. شد حيلك يا بطل! — ' + me;
    return 'يا ' + first(r.name) + ' برافو عليك 🔥 كمّل كده! — ' + me;
  }

  /* The single most useful thing to do right now. */
  function coachCard(d) {
    var t = d.totals;
    var close = d.team.filter(function (r) { return r.state === 'active' && r.nextOrders; })
      .sort(function (a, b) { return (a.daysLeft - b.daysLeft) || (a.ordersToNext - b.ordersToNext); });
    var urgent = close.filter(function (r) { return r.daysLeft <= 7; })[0];
    if (urgent) {
      return '<section class="card coach warn"><div class="coach-head"><span class="coach-ico">' + icon('bolt') + '</span><div>' +
        '<h3>' + esc(first(urgent.name)) + ' فاضله ' + urgent.ordersToNext + ' أوردر على ' + money(urgent.nextBonus) + ' ج</h3>' +
        '<p>' + (urgent.daysLeft === 0 ? 'النهارده آخر يوم يتحسب.' : 'باقي ' + plural(urgent.daysLeft, 'يوم واحد', 'أيام') + ' بس.') + ' رسالة منك ممكن تفرق.</p></div></div>' +
        (urgent.phone ? '<a class="btn btn-wa btn-sm" href="' + wa(urgent.phone, encourageMsg(urgent)) + '" target="_blank" rel="noopener">' + icon('wa') + 'شجّعه على واتساب</a>' : '') + '</section>';
    }
    if (t.nudges) {
      return '<section class="card coach warn"><div class="coach-head"><span class="coach-ico">' + icon('bell') + '</span><div>' +
        '<h3>' + plural(t.nudges, 'مرشح واحد محتاج', 'مرشحين محتاجين') + ' متابعة</h3>' +
        '<p>بقالهم ' + d.season.nudgeAfterDays + ' أيام أو أكتر على نفس الخطوة. كل يوم تأخير بيقلل فرصتهم.</p></div></div>' +
        '<button type="button" class="btn btn-gold btn-sm" data-go-view="pipeline" data-filter="nudge">تابعهم دلوقتي</button></section>';
    }
    if (close[0]) {
      var c = close[0];
      return '<section class="card coach"><div class="coach-head"><span class="coach-ico">' + icon('up') + '</span><div>' +
        '<h3>' + esc(first(c.name)) + ' قرّب: ' + c.ordersToNext + ' أوردر ويفتح ' + money(c.nextBonus) + ' ج</h3>' +
        '<p>قدامه ' + plural(c.daysLeft, 'يوم واحد', 'يوم') + '. فريقك ماشي كويس، كمّل.</p></div></div></section>';
    }
    return '<section class="card coach"><div class="coach-head"><span class="coach-ico">' + icon('plus') + '</span><div>' +
      '<h3>كل طيار جديد = لحد ' + money(d.season.tiers[d.season.tiers.length - 1].bonus) + ' ج ليك</h3>' +
      '<p>فكّر في 3 أصحاب ممكن يشتغلوا، وابعتلهم لينكك النهارده.</p></div></div>' +
      '<button type="button" class="btn btn-primary btn-sm" data-go-view="profile">ابعت لينكك</button></section>';
  }

  function badges(d) {
    var top = d.season.tiers[d.season.tiers.length - 1];
    var list = [
      ['🎯', 'أول ترشيح', d.pipeline.length + d.team.length >= 1],
      ['🛵', 'أول تعيين', d.team.length >= 1],
      ['🔥', '5 طيارين', d.team.length >= 5, d.team.length + '/5'],
      ['🏆', 'أول ' + money(top.bonus), d.totals.maxed >= 1]
    ];
    return '<section class="card" style="display:grid;gap:12px"><h2 class="section">إنجازاتك<span class="count">' + list.filter(function (b) { return b[2]; }).length + ' من ' + list.length + '</span></h2>' +
      '<div class="badges">' + list.map(function (b) {
        return '<div class="badge' + (b[2] ? ' got' : '') + '"><i>' + b[0] + '</i><span>' + esc(b[1]) + (b[3] && !b[2] ? '<br><small>' + b[3] + '</small>' : '') + '</span></div>';
      }).join('') + '</div></section>';
  }

  function viewHome() {
    var d = S.dash, t = d.totals;
    if (!d.team.length && !d.pipeline.length) return onboarding(d);

    var potential = d.team.reduce(function (s, r) { return s + (r.state === 'active' && r.nextBonus ? r.nextBonus - r.bonus : 0); }, 0);
    var team = d.team.length ? d.team.map(slip).join('') :
      '<div class="empty">' + icon('people').replace('<svg', '<svg width="34" height="34"') + '<span>لسه مافيش حد من مرشحينك اتعين.<br>تابعهم من "المرشحين" لحد ما يشتغلوا.</span>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-go-view="pipeline">تابع المرشحين</button></div>';

    return '<section class="card hero">' +
        '<span class="eyebrow">إجمالي البونص بتاعك</span>' +
        '<div class="num total"><span data-count="' + t.bonus + '">0</span><small>جنيه</small></div>' +
        '<div class="split">' +
          '<div><span class="num" style="color:var(--gold)" data-count="' + t.payable + '">0</span><span class="lbl">جاهز للصرف</span></div>' +
          '<div><span class="num" data-count="' + t.pending + '">0</span><span class="lbl">لسه بيتحسب ويزيد</span></div>' +
        '</div>' +
        (potential ? '<div class="potential">' + icon('up') + '<span>لو كل طيار وصل الشريحة الجاية: <b>+' + money(potential) + '</b> ج زيادة</span></div>' : '') +
        (t.nextPayout ? '<div class="payout">' + icon('cal') + 'أقرب صرف: <b>' + fmtDay(t.nextPayout) + '</b></div>' : '') +
      '</section>' +
      coachCard(d) +
      '<div class="stats">' +
        '<div class="stat"><span class="num" data-count="' + t.riders + '">0</span><span>طيار اتعين</span></div>' +
        '<div class="stat"><span class="num" data-count="' + t.orders + '">0</span><span>أوردر مكتمل</span></div>' +
        '<div class="stat"><span class="num" data-count="' + t.applicants + '">0</span><span>مرشح</span></div>' +
      '</div>' +
      badges(d) +
      '<h2 class="section">فريقك<span class="count">من ' + fmtDay(d.season.start) + ' · ' + plural(d.team.length, 'طيار واحد', 'طيار') + '</span></h2>' +
      '<div class="list">' + team + '</div>';
  }

  function onboarding(d) {
    var top = d.season.tiers[d.season.tiers.length - 1];
    return '<section class="card hero" style="text-align:center">' +
        '<span class="eyebrow">ابدأ من هنا</span>' +
        '<div class="num total" style="justify-content:center"><span data-count="' + top.bonus + '">0</span><small>ج</small></div>' +
        '<p style="margin:4px 0 0;font:700 16px var(--f-display)">تقدر تكسبهم على كل طيار ترشّحه</p>' +
      '</section>' +
      '<section class="card onboard"><h2 class="section">إزاي تكسب في 3 خطوات</h2><ol>' +
        '<li><span><b>ابعت لينكك</b> لأي حد عايز يشتغل طيار. من "حسابي" بضغطة واحدة على واتساب.</span></li>' +
        '<li><span><b>يتسجل ويتعين</b> — وإنت تتابعه خطوة بخطوة من "المرشحين".</span></li>' +
        '<li><span><b>تقبض بونصه</b> حسب أوردراته في أول ' + (d.season.windowMonths === 2 ? 'شهرين' : d.season.windowMonths + ' شهور') + '، لحد ' + money(top.bonus) + ' ج.</span></li>' +
      '</ol>' +
      '<div class="row-btns"><button type="button" class="btn btn-primary" data-act="candidate">' + icon('plus') + 'رشّح حد</button>' +
      '<button type="button" class="btn btn-ghost" data-go-view="profile">' + icon('wa') + 'ابعت لينكك</button></div></section>' +
      badges(d);
  }

  function slip(r) {
    var tiers = S.dash.season.tiers, top = tiers[tiers.length - 1], max = top.orders;
    var pct = Math.min(100, r.orders / max * 100);
    var ticks = tiers.map(function (x) { return '<b style="inset-inline-start:' + (x.orders / max * 100) + '%"></b>'; }).join('');
    var st = STATE[r.state] || STATE.active;
    var urgent = r.state === 'active' && r.daysLeft <= 7;
    var goal;
    if (r.state === 'maxed') goal = '<span class="gold">🏆 قفل ' + money(top.bonus) + ' ج — الصرف ' + fmtDay(r.payoutDate) + '</span>';
    else if (r.state === 'closed') goal = '<span>البونص اتثبت على <b class="gold">' + money(r.bonus) + ' ج</b> · الصرف ' + fmtDay(r.payoutDate) + '</span>';
    else if (r.nextOrders) goal = '<span>باقي <strong>' + r.ordersToNext + '</strong> أوردر ويفتح <b class="gold">' + money(r.nextBonus) + ' ج</b></span>';
    else goal = '';
    var actions = (r.state === 'active' && r.phone) ?
      '<div class="slip-actions"><a class="btn btn-ghost btn-sm" href="' + wa(r.phone, encourageMsg(r)) + '" target="_blank" rel="noopener">' + icon('wa') + 'شجّعه</a>' +
      '<a class="round" href="tel:+' + intl(r.phone) + '" aria-label="اتصل بـ ' + esc(first(r.name)) + '">' + icon('phone') + '</a></div>' : '';
    return '<article class="slip ' + r.state + (urgent ? ' urgent' : '') + '">' +
      '<div class="slip-head"><div><h3 class="slip-name">' + esc(cleanName(r.name)) + '</h3>' +
        '<div class="slip-meta"><span class="ltr">#' + esc(r.code) + '</span><span>' + esc(r.zone || '—') + '</span><span>اتعين ' + fmtDay(r.hireDate) + '</span></div></div>' +
        '<span class="pill ' + st[1] + '">' + st[0] + '</span></div>' +
      '<div class="figures">' +
        '<div><span class="num" data-count="' + r.orders + '">0</span><span>أوردر</span></div>' +
        '<div><span class="num gold" data-count="' + r.bonus + '">0</span><span>بونص (ج)</span></div>' +
        '<div><span class="num' + (urgent ? ' red' : '') + '">' + (r.state === 'active' ? r.daysLeft : '—') + '</span><span>' + (r.state === 'active' ? 'يوم باقي' : 'لحد ' + fmtDay(r.lastDay)) + '</span></div>' +
      '</div>' +
      '<div class="track" role="img" aria-label="' + r.orders + ' من ' + max + ' أوردر"><i data-w="' + pct.toFixed(1) + '"></i>' + ticks + '</div>' +
      (goal ? '<div class="goal">' + goal + '</div>' : '') + actions +
    '</article>';
  }

  /* ───────────── Pipeline ───────────── */
  var FILTERS = [
    ['all', 'الكل', function () { return true; }],
    ['nudge', 'محتاج متابعة', function (p) { return p.nudge; }],
    ['moving', 'في الطريق', function (p) { return !p.rejected && p.status !== 'اشتغل'; }],
    ['hired', 'اشتغل', function (p) { return p.status === 'اشتغل'; }],
    ['rejected', 'مرفوض', function (p) { return p.rejected; }]
  ];

  function viewPipeline() {
    var p = S.dash.pipeline;
    var chips = FILTERS.map(function (f) {
      var n = p.filter(f[2]).length;
      if (f[0] !== 'all' && !n && S.filter !== f[0]) return '';
      return '<button type="button" class="chip" data-filter="' + f[0] + '" aria-pressed="' + (S.filter === f[0]) + '">' + f[1] + '<span class="n">' + n + '</span></button>';
    }).join('');
    var pick = FILTERS.filter(function (f) { return f[0] === S.filter; })[0] || FILTERS[0];
    var list = p.filter(pick[2]);
    var hired = p.filter(function (x) { return x.status === 'اشتغل'; }).length;
    return '<h2 class="section">المرشحين بتوعك<span class="count">' + (p.length ? hired + ' من ' + p.length + ' اشتغلوا' : '') + '</span></h2>' +
      '<div class="chips" role="group" aria-label="فلترة">' + chips + '</div>' +
      '<div class="list">' + (list.length ? list.map(appCard).join('') :
        '<div class="empty">' + (p.length ? 'مافيش مرشحين في القسم ده.' : 'لسه مارشحتش حد.<br>اضغط + تحت وابدأ بأول واحد.') + '</div>') + '</div>';
  }

  function appCard(a) {
    var steps = S.dash.statuses.slice(0, 5);
    var stage = a.stage;
    var stepper = '<div class="steps' + (a.rejected ? ' rejected' : '') + '" aria-label="الحالة: ' + esc(a.status) + '">' + steps.map(function (s, i) {
      var cls = a.rejected ? (i === 0 ? 'now' : '') : (i < stage ? 'done' : i === stage ? (stage === 4 ? 'done' : 'now') : '');
      return '<div class="' + cls + '">' + esc(s.replace('تم حضور ', '')) + '</div>';
    }).join('') + '</div>';
    var pill = a.status === 'اشتغل' ? 'green' : a.rejected ? 'red' : a.status === 'جديد' ? 'dim' : 'blue';
    var me = first(S.dash.user.name);
    var msg = 'أهلاً ' + first(a.name) + '، أنا ' + me + ' من Full Speed 👋 طلبك عندنا "' + a.status + '". لو محتاج مساعدة تكمل الورق كلمني، عايزين ننزّلك الشغل بسرعة 🚀';
    var nudge = a.nudge ? '<div class="note warn"><span><b>محتاج متابعة:</b> بقاله ' + plural(a.daysWaiting, 'يوم', 'يوم') + ' على "' + esc(a.status) + '".</span>' +
      (a.phone ? '<a class="btn btn-wa btn-sm" href="' + wa(a.phone, msg) + '" target="_blank" rel="noopener">' + icon('wa') + 'ابعتله رسالة جاهزة</a>' : '') + '</div>' : '';
    var note = a.note ? '<div class="note"><b>ملاحظة الإدارة:</b> ' + esc(a.note) + '</div>' : '';
    var hired = a.status === 'اشتغل' && a.hiredCode ? '<div class="note ok"><b>اتعين ✓</b> كوده <span class="ltr">#' + esc(a.hiredCode) + '</span>' + (a.hiredDate ? ' من ' + fmtDay(a.hiredDate) : '') + ' — تابع أوردراته في الرئيسية.</div>' : '';
    return '<article class="slip">' +
      '<div class="slip-head"><div><h3 class="slip-name">' + esc(a.name) + '</h3>' +
      '<div class="slip-meta"><span>اتقدم ' + fmtDay(a.submitted) + '</span><span>' + esc(a.zone) + '</span></div></div>' +
      '<span class="pill ' + pill + '">' + esc(a.status) + '</span></div>' +
      stepper + hired + nudge + note +
      (!a.nudge && a.phone && a.status !== 'اشتغل' && !a.rejected ? '<div class="slip-actions"><a class="btn btn-ghost btn-sm" href="' + wa(a.phone, msg) + '" target="_blank" rel="noopener">' + icon('wa') + 'كلّمه</a><a class="round" href="tel:+' + intl(a.phone) + '" aria-label="اتصال">' + icon('phone') + '</a></div>' : '') +
    '</article>';
  }

  /* ───────────── Bonus guide ───────────── */
  function viewBonus() {
    var tiers = S.dash.season.tiers, months = S.dash.season.windowMonths;
    var top = tiers[tiers.length - 1];
    var ladder = tiers.map(function (t) {
      return '<div class="rung" data-orders="' + t.orders + '"><span class="num orders">' + t.orders + '</span><span class="bar" style="width:' + (t.bonus / top.bonus * 100) + '%"></span><span class="num money">' + money(t.bonus) + '</span></div>';
    }).join('');
    return '<section class="card sim"><span class="eyebrow">احسبها بنفسك</span>' +
      '<div class="field"><label>هترشّح كام طيار؟</label><div class="stepper"><button type="button" id="simMinus" aria-label="أقل">−</button><output id="simRiders" class="num">3</output><button type="button" id="simPlus" aria-label="أكتر">+</button></div></div>' +
      '<div class="field"><label for="simOrders">كل واحد هيعمل كام أوردر في ' + (months === 2 ? 'الشهرين' : months + ' شهور') + '؟ <b class="num" id="simOrdersOut" style="font-size:22px">400</b></label>' +
      '<input type="range" id="simOrders" min="0" max="' + (top.orders + 150) + '" step="10" value="400"></div>' +
      '<div class="sim-out"><div><span class="muted" style="font-size:13px">هتكسب حوالي</span><div class="num" id="simTotal">0</div></div><span class="muted" id="simPer" style="font-size:13px;text-align:end"></span></div>' +
    '</section>' +
    '<section class="card"><h2 class="section">الشرايح<span class="count">أوردر ← جنيه</span></h2><div class="ladder" id="ladder" style="margin-top:12px">' + ladder + '</div></section>' +
    '<section class="card"><span class="eyebrow">برنامج بونص ترشيحي</span>' +
      '<h2 class="section" style="margin-top:4px">الشروط</h2>' +
      '<ul class="rules" style="margin-top:12px">' +
        '<li>' + icon('check') + '<span>المرشح لازم يكون <b>جديد على Full Speed</b> — مالوش أي بيانات قديمة عندنا.</span></li>' +
        '<li>' + icon('check') + '<span>بنحسب <b>الأوردرات المكتملة بس</b>.</span></li>' +
        '<li>' + icon('check') + '<span>الأوردرات بتتحسب خلال <b>' + (months === 2 ? 'شهرين' : months + ' شهور') + '</b> من تاريخ تعيينه.</span></li>' +
        '<li>' + icon('check') + '<span>البونص بيتصرف بعد ما المدة تخلص، أو أول ما يوصل <b>' + top.orders + ' أوردر</b>.</span></li>' +
      '</ul>' +
      '<p class="example">مثال: لو اتعين <b>8 نوفمبر</b>، آخر يوم بيتحسب <b>7 يناير</b>. اللي يوصله لحد اليوم ده بيتثبت ومش بيقل.</p>' +
    '</section>';
  }

  function tierBonus(orders) {
    var b = 0;
    S.dash.season.tiers.forEach(function (t) { if (orders >= t.orders) b = t.bonus; });
    return b;
  }

  function bindSim() {
    var o = document.getElementById('simOrders');
    if (!o) return;
    var riders = 3;
    function upd() {
      var per = tierBonus(+o.value);
      document.getElementById('simRiders').textContent = riders;
      document.getElementById('simOrdersOut').textContent = o.value;
      document.getElementById('simTotal').textContent = money(per * riders) + ' ج';
      document.getElementById('simPer').textContent = per ? money(per) + ' ج × ' + riders : 'محتاج ' + S.dash.season.tiers[0].orders + ' أوردر على الأقل';
      document.querySelectorAll('#ladder .rung').forEach(function (r) { r.classList.toggle('hit', +r.dataset.orders <= +o.value); });
    }
    document.getElementById('simMinus').onclick = function () { riders = Math.max(1, riders - 1); buzz(); upd(); };
    document.getElementById('simPlus').onclick = function () { riders = Math.min(50, riders + 1); buzz(); upd(); };
    o.oninput = upd; upd();
  }

  /* ───────────── Profile ───────────── */
  function appLink() {
    var here = location.href.split('#')[0].split('?')[0];
    var base = IS_APP ? here : ((S.boot && S.boot.appUrl) || here);
    return base + '?ref=' + encodeURIComponent(S.dash.user.refParam);
  }
  function inviteText() {
    return 'عايز تشتغل طيار مع Full Speed على طلبات؟ 🛵💰\n1) سجّل في طلبات من اللينك ده:\n' + S.dash.user.talabatLink +
      '\n2) وابعت بياناتك هنا عشان نتابعك لحد ما تنزل الشغل:\n' + appLink();
  }

  function viewProfile() {
    var u = S.dash.user, ext = u.type === 'external';
    var rows = ext ? [
      ['الاسم', esc(u.name)], ['الموبايل', '<span class="ltr">' + esc(u.phone) + '</span>'], ['كود الشريك', '<span class="ltr">' + esc(u.code) + '</span>']
    ] : [
      ['الموبايل', '<span class="ltr">' + esc(u.phone || '—') + '</span>'], ['المشرف', esc(u.supervisor || '—')],
      ['المنطقة', esc(u.zone || '—')], ['المركبة', esc(u.vehicle || '—')]
    ];
    return '<section class="card invite"><span class="eyebrow">ادعي صحابك</span>' +
      '<h2 class="section">كل واحد يشتغل من لينكك = بونص ليك</h2>' +
      '<a class="btn btn-wa btn-block" href="' + wa('', inviteText()) + '" target="_blank" rel="noopener">' + icon('wa') + 'ابعت الدعوة على واتساب</a>' +
      '<div class="row-btns"><button type="button" class="btn btn-ghost btn-sm" id="copyInvite">' + icon('copy') + 'انسخ الرسالة</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" id="qrBtn" aria-expanded="false">' + icon('qr') + 'كود QR</button></div>' +
      '<div class="qr" id="qrBox" hidden><div id="qrCode"></div><span>خلّي صاحبك يصوّر الكود بكاميرا موبايله</span></div>' +
      '<details class="links"><summary>اللينكات بالتفصيل</summary>' +
        '<span class="muted" style="font-size:12px">لينك التسجيل في طلبات' + (ext ? ' (الموحّد للشركاء)' : ' — باسم كودك') + '</span><code>' + esc(u.talabatLink) + '</code>' +
        '<span class="muted" style="font-size:12px;display:block;margin-top:8px">لينك استمارة Full Speed</span><code>' + esc(appLink()) + '</code>' +
      '</details></section>' +
    '<section class="card"><div class="pass-top"><i class="mk" aria-hidden="true"></i><div style="min-width:0"><span class="eyebrow">' + (ext ? 'شريك Full Speed' : 'طيار Full Speed') + '</span><h3>' + esc(cleanName(u.name)) + '</h3></div>' +
      (ext ? '' : '<span class="num code-big ltr" style="margin-inline-start:auto">' + esc(u.code) + '</span>') + '</div>' +
      rows.map(function (r) { return '<div class="kv"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; }).join('') +
    '</section>' +
    (IS_GAS && S.boot && /github\.io/.test(S.boot.appUrl || '') ?
      '<section class="card" style="display:grid;gap:10px"><h2 class="section">ثبّت التطبيق على موبايلك</h2><p class="muted" style="margin:0;font-size:13px">أسرع، وبيفتح بأيقونة على الشاشة.</p>' +
      '<a class="btn btn-primary btn-block" href="' + esc(S.boot.appUrl) + '" target="_blank" rel="noopener">افتح التطبيق</a></section>' : '') +
    '<details class="card"><summary style="font:700 15px var(--f-display);min-height:28px;cursor:pointer">تغيير كلمة المرور</summary>' +
      '<form class="form" id="pwForm" style="margin-top:12px" novalidate>' +
        '<div class="field"><label for="pw-cur">الحالية</label><input id="pw-cur" name="current" type="password" autocomplete="current-password"></div>' +
        '<div class="field"><label for="pw-new">الجديدة</label><input id="pw-new" name="next" type="password" autocomplete="new-password"></div>' +
        '<button class="btn btn-ghost" type="submit">غيّر كلمة المرور</button>' +
      '</form></details>' +
    '<button type="button" class="btn btn-ghost btn-block" id="logoutBtn" style="color:var(--danger)">تسجيل خروج</button>';
  }

  var qrLoading = null;
  function loadQr() {
    if (window.QRCode) return Promise.resolve();
    if (qrLoading) return qrLoading;
    qrLoading = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.onload = resolve; s.onerror = function () { qrLoading = null; reject(); };
      document.head.appendChild(s);
    });
    return qrLoading;
  }

  /* ───────────── Candidate form ───────────── */
  function candidateFields(zones) {
    var opts = '<option value="">اختار المنطقة…</option>' + (zones || []).map(function (z) { return '<option>' + esc(z) + '</option>'; }).join('');
    return '<div class="field"><label for="c-name">الاسم زي البطاقة</label><input id="c-name" name="fullName" autocomplete="off" enterkeyhint="next" placeholder="ثلاثي على الأقل" required></div>' +
      '<div class="field"><label for="c-mobile">رقم الموبايل</label><input id="c-mobile" name="mobile" type="tel" class="ltr" inputmode="numeric" maxlength="11" enterkeyhint="next" placeholder="01xxxxxxxxx" required></div>' +
      '<div class="field"><label for="c-nid">الرقم القومي</label><input id="c-nid" name="nationalId" class="ltr" inputmode="numeric" maxlength="14" enterkeyhint="next" placeholder="14 رقم" required><span class="derived" id="nidOut"></span></div>' +
      '<div class="field"><label for="c-zone">منطقة الشغل</label><select id="c-zone" name="zone" required>' + opts + '</select></div>' +
      '<div class="field"><label for="c-address">العنوان</label><input id="c-address" name="address" enterkeyhint="next" placeholder="المحافظة - المنطقة - الشارع" required></div>' +
      '<div class="row2"><div class="field"><label for="c-idexp">انتهاء البطاقة</label><input id="c-idexp" name="idExpiry" type="date" required></div>' +
      '<div class="field"><label for="c-licexp">انتهاء الرخصة</label><input id="c-licexp" name="licenseExpiry" type="date"><span class="hint">مش مطلوبة للعجلة</span></div></div>' +
      '<div class="field"><label for="c-plate">رقم اللوحة</label><input id="c-plate" name="plate" enterkeyhint="done" placeholder="سيبها فاضية لو عجلة"></div>';
  }

  function bindNid(root) {
    var nid = root.querySelector('[name=nationalId]'), out = root.querySelector('#nidOut'), mob = root.querySelector('[name=mobile]');
    if (mob) mob.addEventListener('input', function () {
      mob.value = mob.value.replace(/\D/g, '').slice(0, 11);
      mob.closest('.field').classList.toggle('ok', /^01[0125]\d{8}$/.test(mob.value));
    });
    if (!nid) return;
    nid.addEventListener('input', function () {
      nid.value = nid.value.replace(/\D/g, '').slice(0, 14);
      var f = nid.closest('.field'); f.classList.remove('ok');
      if (nid.value.length < 14) { out.textContent = nid.value.length ? (14 - nid.value.length) + ' أرقام فاضلة' : ''; out.style.color = 'var(--dim)'; return; }
      var b = nidBirth(nid.value);
      if (!b) { out.textContent = 'الرقم ده مش صحيح، راجعه'; out.style.color = 'var(--danger)'; return; }
      var age = new Date().getFullYear() - b.getFullYear();
      f.classList.add('ok'); out.style.color = ''; out.textContent = '✓ مواليد ' + DFY.format(b) + ' (' + age + ' سنة تقريباً)';
    });
  }

  function openCandidate() {
    var sheet = document.getElementById('sheet');
    sheet.innerHTML = '<div role="dialog" aria-modal="true" aria-labelledby="candTitle"><div class="grab"></div><div class="inner">' +
      '<div class="sheet-head"><h3 id="candTitle">ترشيح طيار جديد</h3><button type="button" class="icon-btn" data-close aria-label="إغلاق">' + icon('x') + '</button></div>' +
      '<p class="muted" style="margin:0;font-size:13px">بيتسجل على ' + (S.dash.user.type === 'external' ? 'حسابك كشريك' : 'كودك') + '. تاريخ الميلاد بيطلع لوحده من الرقم القومي.</p>' +
      '<form class="form" id="candForm" novalidate>' + candidateFields(S.boot && S.boot.zones) +
      '<div class="sticky-cta"><button class="btn btn-primary btn-block" type="submit">ابعت للإدارة</button></div></form></div></div>';
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    sheet.querySelector('[data-close]').onclick = closeSheet;
    sheet.onclick = function (e) { if (e.target === sheet) closeSheet(); };
    bindNid(sheet);
    document.getElementById('candForm').onsubmit = async function (e) {
      e.preventDefault();
      var form = e.currentTarget, btn = form.querySelector('[type=submit]'), data = formData(form);
      busy(btn, true, 'بنتأكد إنه جديد…');
      var res = await call('submitCandidate', { token: S.token, form: data });
      busy(btn, false);
      if (!res.ok) { showErrors(form, res.fields); return; }
      S.dash = res.data.dashboard; S.filter = 'all';
      buzz(); confetti();
      var name = String(data.fullName).split(/\s+/)[0];
      var msg = 'أهلاً ' + name + ' 👋 أنا ' + first(S.dash.user.name) + '، رشّحتك تشتغل مع Full Speed على طلبات 🛵\nسجّل من اللينك ده عشان نكمّل التعيين:\n' + S.dash.user.talabatLink;
      sheet.querySelector('.inner').innerHTML = '<div class="done-screen"><div class="tick">' + icon('check') + '</div>' +
        '<h3>' + esc(name) + ' اتسجل ✓</h3><p>الإدارة هتكلمه قريب. الخطوة الجاية: ابعتله لينك التسجيل في طلبات عشان يتحسب عليك.</p></div>' +
        '<a class="btn btn-wa btn-block" href="' + wa(data.mobile, msg) + '" target="_blank" rel="noopener">' + icon('wa') + 'ابعت لـ ' + esc(name) + ' لينك طلبات</a>' +
        '<div class="row-btns"><button type="button" class="btn btn-ghost" id="again">رشّح حد تاني</button><button type="button" class="btn btn-ghost" id="doneBtn">تمام</button></div>';
      document.getElementById('again').onclick = openCandidate;
      document.getElementById('doneBtn').onclick = function () { closeSheet(); go('pipeline'); };
    };
    setTimeout(function () { var f = document.getElementById('c-name'); if (f && !('ontouchstart' in window)) f.focus(); }, 60);
  }
  function closeSheet() {
    var s = document.getElementById('sheet');
    if (s.hidden) return;
    s.hidden = true; s.innerHTML = ''; document.body.style.overflow = '';
    if (S.dash) renderApp();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function renderPublicApply() {
    document.getElementById('dock').hidden = true;
    var r = S.boot.referrer;
    if (!r || !r.valid) {
      app.innerHTML = '<section class="auth">' + brand() + '<div class="card" style="text-align:center;display:grid;gap:8px"><h2 class="section" style="justify-content:center">اللينك ده مش صحيح</h2><p class="muted" style="margin:0">اطلب لينك الترشيح تاني من الشخص اللي رشّحك.</p></div></section>';
      return;
    }
    app.innerHTML = '<section class="auth" style="align-content:start">' + brand() +
      (live ? '' : '<div class="demo-flag">نسخة تجريبية — مفيش حاجة بتتبعت فعلاً</div>') +
      '<div class="card"><span class="eyebrow">استمارة انضمام</span><h2 class="section" style="margin-top:4px">' + esc(r.firstName) + ' رشّحك تشتغل معانا 🛵</h2>' +
      '<p class="muted" style="margin:6px 0 0;font-size:14px">املا بياناتك في دقيقة، وفريق Full Speed هيكلمك يكمل معاك التعيين على طلبات.</p></div>' +
      '<form class="card form" id="pubForm" novalidate>' + candidateFields(S.boot.zones) +
      '<button class="btn btn-primary btn-block" type="submit">ابعت طلبي</button></form></section>';
    bindNid(app);
    document.getElementById('pubForm').onsubmit = async function (e) {
      e.preventDefault();
      var form = e.currentTarget, btn = form.querySelector('[type=submit]');
      busy(btn, true, 'بنبعت طلبك…');
      var res = await call('publicApply', { ref: S.ref, form: formData(form) });
      busy(btn, false);
      if (!res.ok) { showErrors(form, res.fields); return; }
      confetti();
      app.innerHTML = '<section class="auth">' + brand() + '<div class="card done-screen"><div class="tick">' + icon('check') + '</div>' +
        '<h3>طلبك وصل ✓</h3><p>فريق Full Speed هيكلمك على رقمك قريب.<br>لو لسه ما سجلتش في طلبات، اطلب اللينك من ' + esc(res.data.referrer) + '.</p></div></section>';
    };
  }

  /* ───────────── Wiring ───────────── */
  function bindView() {
    app.querySelectorAll('[data-act="candidate"]').forEach(function (b) { b.onclick = function () { buzz(); openCandidate(); }; });
    app.querySelectorAll('[data-go-view]').forEach(function (b) { b.onclick = function () { go(b.dataset.goView, b.dataset.filter); }; });
    app.querySelectorAll('.chip[data-filter]').forEach(function (b) { b.onclick = function () { S.filter = b.dataset.filter; buzz(); renderApp(); }; });
    bindSim();
    var ci = document.getElementById('copyInvite');
    if (ci) ci.onclick = function () { copy(inviteText()); };
    var qb = document.getElementById('qrBtn');
    if (qb) qb.onclick = function () {
      var box = document.getElementById('qrBox'), open = box.hidden;
      box.hidden = !open; qb.setAttribute('aria-expanded', String(open));
      if (!open || document.getElementById('qrCode').childNodes.length) return;
      loadQr().then(function () {
        new window.QRCode(document.getElementById('qrCode'), { text: appLink(), width: 200, height: 200, colorDark: '#0C150E', colorLight: '#ffffff' });
      }, function () { document.getElementById('qrCode').textContent = 'مقدرناش نحمّل الـ QR دلوقتي. ابعت اللينك على واتساب.'; });
    };
    var pw = document.getElementById('pwForm');
    if (pw) pw.onsubmit = async function (e) {
      e.preventDefault();
      var btn = pw.querySelector('[type=submit]');
      busy(btn, true);
      var d = formData(pw); d.token = S.token;
      var res = await call('changePassword', d);
      busy(btn, false);
      if (!res.ok) { showErrors(pw, res.fields); return; }
      S.token = res.data.token; store('fs_token', S.token); pw.reset(); toast('كلمة المرور اتغيرت، وخرجناك من أي جهاز تاني.');
    };
    var lo = document.getElementById('logoutBtn');
    if (lo) lo.onclick = function () { call('logout', { token: S.token }, { quiet: true }); signOut(); toast('خرجت من حسابك'); };
  }

  /* ───────────── Start ───────────── */
  function skeleton() {
    app.innerHTML = '<div style="display:grid;gap:14px;padding-top:56px">' +
      '<div class="sk" style="height:190px"></div><div class="sk" style="height:96px"></div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="sk" style="height:78px"></div><div class="sk" style="height:78px"></div><div class="sk" style="height:78px"></div></div>' +
      '<div class="sk" style="height:220px"></div></div>';
  }

  (async function start() {
    var token = store('fs_token');
    if (token) skeleton(); else app.innerHTML = '<section class="auth">' + brand() + '<p class="muted" style="text-align:center">بنجهّز…</p></section>';
    S.ref = await Backend.ref();
    var boot = await Backend.call('bootstrap', { ref: S.ref });
    S.boot = boot && boot.ok ? boot.data : { zones: [], tiers: [{ orders: 850, bonus: 3000 }] };
    if (S.ref) { renderPublicApply(); return; }
    if (token) {
      var res = await Backend.call('session', { token: token });
      if (res && res.ok) { S.token = token; S.dash = res.data.dashboard; renderApp(); celebrateOnce(); return; }
      store('fs_token', null);
    }
    renderAuth();
  })();
})();
</script>
